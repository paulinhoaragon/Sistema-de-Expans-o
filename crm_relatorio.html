<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus · Relatório CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="pipeline.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A0F1E;--cobalt:#1A3BAD;--cobalt-br:#2952E3;--cobalt-gl:#4A70F5;
  --gold:#B8962E;--g:#16A34A;--am:#B45309;--red:#DC2626;--purple:#7C3AED;
  --canvas:#ECEEF6;--surface:#fff;--rule:#E2E5F0;
  --t1:#0A0F1E;--t2:#3A4268;--t3:#7A82A8;--t4:#A8B0CC;
  --r8:8px;--r12:12px;
  --sh:0 1px 3px rgba(10,15,30,.06),0 4px 14px rgba(10,15,30,.06);
  --sh-hover:0 2px 8px rgba(10,15,30,.1),0 8px 24px rgba(10,15,30,.08);
  --gap:16px;
}

body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased;}
.page{padding:24px 28px 40px;max-width:1280px;margin:0 auto;}

/* ── Cover ── */
.cover{background:var(--ink);padding:20px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.cover-title{font-family:'Playfair Display',serif;font-size:20px;color:#fff;letter-spacing:-.01em;}
.cover-sub{font-size:9px;color:rgba(255,255,255,.35);margin-top:3px;letter-spacing:.12em;text-transform:uppercase;}
.cover-rule{height:2px;background:linear-gradient(90deg,var(--cobalt-gl),var(--gold),transparent);}

/* ── Seção labels ── */
.sec{margin-bottom:var(--gap);}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;}
.sec-label::before{content:'';display:inline-block;width:3px;height:10px;border-radius:2px;background:var(--cobalt);flex-shrink:0;}

/* ── Grid system unificado ── */
.row{display:grid;gap:var(--gap);margin-bottom:var(--gap);}
.row.cols-4{grid-template-columns:repeat(4,1fr);}
.row.cols-3{grid-template-columns:repeat(3,1fr);}
.row.cols-2{grid-template-columns:1fr 1fr;}
.row.cols-1{grid-template-columns:1fr;}
/* span helpers */
.span-2{grid-column:span 2;}
.span-3{grid-column:span 3;}
@media(max-width:960px){.row.cols-4,.row.cols-3,.row.cols-2{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.row.cols-4,.row.cols-3,.row.cols-2{grid-template-columns:1fr;}.span-2,.span-3{grid-column:span 1;}}

/* ── Cards ── */
.card{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);}
.card-title{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;}

/* ── KPIs ── */
.kpi{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);border-top:2px solid var(--cobalt);display:flex;flex-direction:column;}
.kpi.g{border-top-color:var(--g)}.kpi.gold{border-top-color:var(--gold)}.kpi.am{border-top-color:var(--am)}.kpi.red{border-top-color:var(--red)}.kpi.purple{border-top-color:var(--purple)}
.kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.kpi-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--t1);line-height:1;margin-bottom:auto;}
.kpi-sub{font-size:10px;color:var(--t4);margin-top:6px;line-height:1.4;}

/* ── KPI distribuição de etapas (4 mini-blocos) ── */
.kpi-dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.kpi-dist-item{border-radius:8px;padding:8px 6px;text-align:center;}
.kpi-dist-val{font-size:20px;font-weight:700;line-height:1;}
.kpi-dist-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}

/* ── Barras ── */
.bar-row{margin-bottom:8px;}
.bar-row:last-child{margin-bottom:0;}
.bar-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:3px;}
.bar-track{background:#EEF1FA;border-radius:4px;height:5px;}
.bar-fill{height:5px;border-radius:4px;transition:width .4s ease;}

/* ── Tags/badges ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;}
.t-neg{background:#FEF3C7;color:#92400E}.t-cont{background:#EEF2FD;color:#1A3BAD}
.t-trab{background:#DCFCE7;color:#15803D}.t-dec{background:#FEE2E2;color:#991B1B}
.t-risco{background:#FEE2E2;color:#991B1B}.t-atenc{background:#FEF3C7;color:#92400E}.t-ok{background:#DCFCE7;color:#15803D}

/* ── Candidatos ── */
.cand-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);}
.cand-row:last-child{border-bottom:none;}
.cand-avatar{width:26px;height:26px;border-radius:50%;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#1A3BAD;flex-shrink:0;}
.cand-name{font-size:12px;font-weight:600;color:var(--t1);flex:1;}
.cand-meta{font-size:10px;color:var(--t3);}

/* ── Card accent (borda lateral) ── */
.card-accent{background:var(--surface);border-radius:0 var(--r12) var(--r12) 0;border-left:3px solid var(--cobalt);padding:14px 16px;box-shadow:var(--sh);}
.card-accent.red{border-left-color:var(--red);}
.card-accent.am{border-left-color:var(--am);}
.card-accent.blue{border-left-color:var(--cobalt);}

/* ── Expandir ── */
.btn-expand{display:flex;align-items:center;gap:5px;margin-top:10px;padding:4px 0;font-size:11px;font-weight:600;color:var(--cobalt);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .15s;}
.btn-expand:hover{color:var(--cobalt-br);}

/* ── Tabela hunters ── */
.htable{width:100%;border-collapse:collapse;font-size:12px;}
.htable th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:7px 12px;border-bottom:2px solid var(--rule);text-align:left;white-space:nowrap;}
.htable td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
.htable tbody tr:last-child td{border-bottom:none;}
.htable tbody tr:hover td{background:#F8F9FE;}
.htable td:first-child{font-weight:600;color:var(--t1);}

/* ── Loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--t4);}
.loading-icon{font-size:36px;margin-bottom:12px;}

/* ── Filtros contratação ── */
.filtros-cont{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.filtros-cont button{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--rule);background:var(--canvas);color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .15s;}
.filtros-cont button.ativo{background:var(--cobalt);color:#fff;border-color:var(--cobalt);}

/* ── Stat box (rodapés) ── */
.stat-box{border-radius:8px;padding:10px 14px;text-align:center;flex:1;}
.stat-box-val{font-size:22px;font-weight:700;line-height:1;}
.stat-box-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-top:3px;}
</style>
</head>
<body>

<div class="cover">
  <div>
    <div class="cover-title">Relatório CRM</div>
    <div class="cover-sub">Pipeline de Candidatos · Blue3 Expansão</div>
  </div>
  <div style="text-align:right;">
    <div style="font-size:11px;color:rgba(255,255,255,.45);" id="crm-updated">Carregando...</div>
    <div style="font-size:10px;color:rgba(255,255,255,.25);margin-top:2px;">Confidencial</div>
  </div>
</div>
<div class="cover-rule"></div>

<div class="page" id="crm-root">
  <div class="loading">
    <div class="loading-icon">⏳</div>
    <div style="font-size:14px;font-weight:600;color:var(--t2);">Carregando dados do CRM...</div>
  </div>
</div>

<script>
var SUPA_URL='https://cjimsplgxrwkqgzegnkq.supabase.co';
var SUPA_KEY='sb_publishable_m4pgWOuDEQghiA2w4_axzg_HccJZxDS';
function supa(p){return fetch(SUPA_URL+'/rest/v1/'+p,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'}}).then(function(r){return r.json();});}
function norm(s){return String(s||'').trim().toLowerCase();}
function pct(a,b){return b>0?Math.round(a/b*100)+'%':'—';}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function diasAtras(d){if(!d)return null;return Math.floor((Date.now()-new Date(d).getTime())/(1000*60*60*24));}
function fmt(n){if(!n||n===0)return'—';var a=Math.abs(n);if(a>=1e9)return'R$'+(n/1e9).toFixed(1).replace('.',',')+'B';if(a>=1e6)return'R$'+(n/1e6).toFixed(1).replace('.',',')+'M';if(a>=1e3)return'R$'+Math.round(n/1e3)+'K';return'R$'+n;}

var ETAPA_COR={'Prospecção':'#94A3B8','Qualificação':'#7C3AED','Negociação':'#B45309','Contratação':'#1A3BAD','Trabalhando':'#16A34A','Declinou':'#DC2626','Contato Futuro':'#0891B2'};

// ── Helpers de render ────────────────────────────────────────
function avatar(nome){
  var p=(nome||'').split(' ');
  var ini=(p[0]?p[0][0]:'')+(p[1]?p[1][0]:'');
  return '<div class="cand-avatar">'+ini.toUpperCase()+'</div>';
}

function barRow(lbl,val,total,cor){
  var p=total>0?Math.round(val/total*100):0;
  return '<div class="bar-row">'
    +'<div class="bar-row-hd"><span style="color:var(--t2);">'+esc(lbl)+'</span>'
    +'<span style="font-weight:600;color:var(--t1);">'+val+' <span style="font-weight:400;color:var(--t4);">('+p+'%)</span></span></div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+cor+';"></div></div>'
    +'</div>';
}

function listaCands(arr, TOP, idBase, buildRow) {
  var visible = arr.slice(0, TOP);
  var hidden  = arr.slice(TOP);
  var html = visible.map(buildRow).join('');
  if (hidden.length) {
    var bid = idBase+'-extra';
    html += '<div id="'+bid+'" style="display:none;">'+hidden.map(buildRow).join('')+'</div>';
    html += '<button class="btn-expand" onclick="(function(b){var el=document.getElementById(\''+bid+'\');var open=el.style.display!==\'none\';el.style.display=open?\'none\':\'block\';b.textContent=open?\'▸ Ver mais '+hidden.length+' candidatos\':\'▴ Ocultar\';})(this)">▸ Ver mais '+hidden.length+' candidatos</button>';
  }
  return html;
}

function scoreRisco(c){
  var ancordOk=['aprovada','isento'].indexOf((c.status_ancord||'').toLowerCase())>-1;
  if(ancordOk)return{e:'✅',label:'Pronto onboarding',cor:'#16A34A',bg:'#DCFCE7'};
  var mouOk=norm(c.mou)==='assinado';
  if(!mouOk)return{e:'🔴',label:'Sem MOU',cor:'#DC2626',bg:'#FEE2E2'};
  if(c.data_mou){
    var d=Math.round((Date.now()-new Date(c.data_mou))/(1000*60*60*24));
    if(d>90)return{e:'🔴',label:'Prazo expirado ('+d+'d)',cor:'#DC2626',bg:'#FEE2E2'};
    if(d>60)return{e:'🟡',label:'Prazo adicional ('+d+'d)',cor:'#B45309',bg:'#FEF3C7'};
    return{e:'🟢',label:'No prazo ('+d+'d)',cor:'#16A34A',bg:'#DCFCE7'};
  }
  return{e:'🟡',label:'MOU sem data',cor:'#B45309',bg:'#FEF3C7'};
}

// ── RENDER PRINCIPAL ─────────────────────────────────────────
function renderCRM(cands){
  var root=document.getElementById('crm-root');
  var upd=document.getElementById('crm-updated');
  if(upd) upd.textContent='Atualizado '+new Date().toLocaleDateString('pt-BR');

  if(!cands||!cands.length){
    root.innerHTML='<div class="loading"><div class="loading-icon">📭</div><div>Nenhum candidato encontrado.</div></div>';
    return;
  }

  // ── Segmentações ──
  var ativos     = cands.filter(function(c){return c.etapa==='Trabalhando'||c.etapa==='Contratação';});
  var trabalhando= cands.filter(function(c){return c.etapa==='Trabalhando';});
  var negociacao = cands.filter(function(c){return c.etapa==='Negociação';});
  var contratacao= cands.filter(function(c){return c.etapa==='Contratação';});
  var declinados = cands.filter(function(c){return c.etapa==='Declinou';});
  var total=cands.length;

  // ── Senioridade ──
  var senMap={senior:0,pleno:0,junior:0};
  ativos.forEach(function(c){var s=norm(c.nivel||'');if(s==='sênior')senMap.senior++;else if(s==='pleno')senMap.pleno++;else if(s==='júnior'||s==='junior')senMap.junior++;});

  // ── Praças ──
  var pracaMap={};
  ativos.forEach(function(c){var p=c.praca||'N/I';pracaMap[p]=(pracaMap[p]||0)+1;});
  var pracasTop=Object.keys(pracaMap).sort(function(a,b){return pracaMap[b]-pracaMap[a];});

  // ── Hunters ──
  var hunterMap={};
  cands.forEach(function(c){
    if(!c.hunter)return;
    var h=c.hunter.trim();
    if(!hunterMap[h])hunterMap[h]={total:0,ativos:0,trab:0,neg:0,dec:0,auc:0};
    hunterMap[h].total++;
    if(c.etapa==='Trabalhando'||c.etapa==='Contratação')hunterMap[h].ativos++;
    if(c.etapa==='Trabalhando')hunterMap[h].trab++;
    if(c.etapa==='Negociação')hunterMap[h].neg++;
    if(c.etapa==='Declinou')hunterMap[h].dec++;
    hunterMap[h].auc+=(parseFloat(c.auc_mm)||0);
  });

  // ── Origens ──
  var instMap={};
  cands.forEach(function(c){
    if(!c.instituicao)return;
    var k=c.instituicao.trim();
    if(!instMap[k])instMap[k]={total:0,ativos:0,dec:0};
    instMap[k].total++;
    if(c.etapa==='Trabalhando'||c.etapa==='Contratação')instMap[k].ativos++;
    if(c.etapa==='Declinou')instMap[k].dec++;
  });
  var instTop=Object.keys(instMap).sort(function(a,b){return instMap[b].total-instMap[a].total;}).slice(0,8);

  // ── MOU pendente ──
  var semMOU=ativos.filter(function(c){return norm(c.mou)!=='assinado';})
    .sort(function(a,b){return (diasAtras(a.data_entrada)||0)-(diasAtras(b.data_entrada)||0);}).reverse();

  // ── Sem movimentação (travados) ──
  var LIMIAR={'Negociação':30,'Contratação':45};
  var travados=cands.filter(function(c){
    var lim=LIMIAR[c.etapa]; if(!lim)return false;
    var d=diasAtras(c.data_entrada); return d!==null&&d>=lim;
  }).sort(function(a,b){return(diasAtras(b.data_entrada)||0)-(diasAtras(a.data_entrada)||0);});

  // ── Precisam de contato ──
  var LIMIAR_CONTATO=14;
  function ultimoContato(c){
    var raw=c.comentarios||''; if(!raw.trim())return null;
    var blocos=raw.split('\n---\n');
    var datas=blocos.map(function(b){var m=b.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(m[3]+'-'+m[2]+'-'+m[1]).getTime():null;}).filter(Boolean);
    return datas.length?Math.max.apply(null,datas):null;
  }
  var pipeAtivo=cands.filter(function(c){return['Negociação','Contratação'].indexOf(c.etapa)>-1;});
  var semContato=pipeAtivo.filter(function(c){
    var uc=ultimoContato(c);
    if(!uc)return true;
    return Math.floor((Date.now()-uc)/(1000*60*60*24))>LIMIAR_CONTATO;
  }).sort(function(a,b){
    var ua=ultimoContato(a), ub=ultimoContato(b);
    return (ua||0)-(ub||0);
  });

  // ── Estratégicos ──
  var estrat=cands.filter(function(c){return norm(c.estrategico)==='sim';});
  var aucEstrat=estrat.filter(function(c){return c.etapa==='Trabalhando'||c.etapa==='Contratação';}).reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── AuC contratado (trabalhando + contratação, somente vaga Assessor) ──
  var ativosAssessor=ativos.filter(function(c){return norm(c.vaga||'').indexOf('assessor')>-1;});
  var aucContratado=ativosAssessor.reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── AuC em negociação ──
  var aucNegociacao=negociacao.reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── Top líderes (somente vaga Assessor) ──
  var liderMap={};
  cands.filter(function(c){
    var v=norm(c.vaga||'');
    return v.indexOf('assessor')>-1&&c.lider&&c.lider.trim();
  }).forEach(function(c){
    var l=c.lider.trim();
    if(!liderMap[l])liderMap[l]={total:0,ativos:0};
    liderMap[l].total++;
    if(c.etapa==='Trabalhando'||c.etapa==='Contratação')liderMap[l].ativos++;
  });
  var lideresTop=Object.keys(liderMap).sort(function(a,b){return liderMap[b].ativos-liderMap[a].ativos;}).slice(0,3);

  // ── Contratação por status ──
  var contSorted=contratacao.slice().sort(function(a,b){
    var ordem={'🔴':0,'🟡':1,'🟢':2,'✅':3};
    return (ordem[scoreRisco(a).e]||2)-(ordem[scoreRisco(b).e]||2);
  });
  window._crmContSorted=contSorted;

  // ══════════════════════════════════════
  // HTML
  // ══════════════════════════════════════
  root.innerHTML=[

    // ① PULSO DO PIPELINE — 4 colunas: Total(span2) + Contratados + Sênior + Praça
    '<div class="sec-label" style="margin-top:0;">Pulso do pipeline</div>',
    '<div class="row cols-4">',

      '<div class="kpi" style="grid-column:span 2;">'
        +'<div class="kpi-lbl">Total no funil</div>'
        +'<div class="kpi-val">'+total+'</div>'
        +'<div class="kpi-dist">'
          +'<div class="kpi-dist-item" style="background:#FEF3C7;">'
            +'<div class="kpi-dist-val" style="color:#92400E;">'+negociacao.length+'</div>'
            +'<div class="kpi-dist-lbl" style="color:#B45309;">Negociação</div>'
          +'</div>'
          +'<div class="kpi-dist-item" style="background:#EEF2FD;">'
            +'<div class="kpi-dist-val" style="color:#1A3BAD;">'+contratacao.length+'</div>'
            +'<div class="kpi-dist-lbl" style="color:#1A3BAD;">Contratação</div>'
          +'</div>'
          +'<div class="kpi-dist-item" style="background:#DCFCE7;">'
            +'<div class="kpi-dist-val" style="color:#15803D;">'+trabalhando.length+'</div>'
            +'<div class="kpi-dist-lbl" style="color:#16A34A;">Trabalhando</div>'
          +'</div>'
          +'<div class="kpi-dist-item" style="background:#FEE2E2;">'
            +'<div class="kpi-dist-val" style="color:#991B1B;">'+declinados.length+'</div>'
            +'<div class="kpi-dist-lbl" style="color:#DC2626;">Declinados</div>'
          +'</div>'
        +'</div>'
      +'</div>',

      '<div class="kpi g">'
        +'<div class="kpi-lbl">Contratados ativos</div>'
        +'<div class="kpi-val">'+ativos.length+'</div>'
        +'<div class="kpi-sub">'+trabalhando.length+' trabalhando</div>'
        +'<div class="kpi-sub">'+(ativos.length-trabalhando.length)+' a iniciar · '+pct(ativos.length,total)+' conversão</div>'
      +'</div>',

      '<div class="kpi purple">'
        +'<div class="kpi-lbl">Perfil sênior</div>'
        +'<div class="kpi-val">'+pct(senMap.senior,ativos.length)+'</div>'
        +'<div class="kpi-sub">'+senMap.senior+' sênior</div>'
        +'<div class="kpi-sub">'+senMap.pleno+' pleno · '+senMap.junior+' júnior</div>'
      +'</div>',

    '</div>',

    // Segunda linha de KPIs — AuC Contratado | AuC em Negociação | Top Praça | Top Líderes
    '<div class="row cols-4">',

      '<div class="kpi g">'
        +'<div class="kpi-lbl">AuC contratado</div>'
        +'<div class="kpi-val" style="font-size:22px;margin-top:2px;">'+fmt(aucContratado*1e6)+'</div>'
        +'<div class="kpi-sub">'+ativosAssessor.length+' assessores ativos</div>'

          var s=hist.slice().sort(function(a,b){return new Date(a.entrada||a.timestamp)-new Date(b.entrada||b.timestamp);});
          s.forEach(function(h){
            var etapa=h.etapa, inicio=new Date(h.entrada||h.timestamp);

            var dias=Math.round((fim-inicio)/(1000*60*60*24));
            if(dias>=0&&dias<730&&ETAPAS_VEL.indexOf(etapa)>-1){ tempoEtapa[etapa]+=dias; contagemEtapa[etapa]++; }
          });
        });
        var etapasComDados=ETAPAS_VEL.filter(function(e){ return contagemEtapa[e]>0; });

        var tempos=[];

          var dias=Math.round((Date.now()-inicio.getTime())/(1000*60*60*24));
          if(dias>0&&dias<500)tempos.push(dias);

        var medTotal=tempos.length?Math.round(tempos.reduce(function(s,v){return s+v;},0)/tempos.length):null;
        var barras=etapasComDados.map(function(e){

            +'</div>';

        return'<div class="card"><div class="card-title">Tempo médio por etapa</div>'+barras+rodape+'</div>';
      })(),

      (function(){

        var CORES_CONV={'Prospecção':'#94A3B8','Qualificação':'#7C3AED','Negociação':'#B45309','Contratação':'#1A3BAD','Trabalhando':'#16A34A','Declinou':'#DC2626'};
        var byEtapa={};
        cands.forEach(function(c){ byEtapa[c.etapa]=(byEtapa[c.etapa]||0)+1; });

        var rodape='<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:12px;">'

// ── filtCont inline ──────────────────────────────────────────
function filtCont(btn, filtro){
  document.querySelectorAll('#filt-cont-btns button').forEach(function(b){b.classList.remove('ativo');});
  btn.classList.add('ativo');
  var mapa={todos:null,pronto:'✅',risco:'🔴',atencao:'🟡',prazo:'🟢'};
  var sorted=window._crmContSorted||[];
  var lista=mapa[filtro]?sorted.filter(function(c){return scoreRisco(c).e===mapa[filtro];}):sorted;
  var body=document.getElementById('cont-body');
  if(!body)return;
  if(!lista.length){body.innerHTML='<div style="padding:16px;text-align:center;font-size:12px;color:var(--t4);">Nenhum candidato neste filtro</div>';return;}
  body.innerHTML=listaCands(lista,5,'cont-lista-dyn',function(c){
    var sc=scoreRisco(c);
    return'<div class="cand-row"><div style="font-size:15px;flex-shrink:0;">'+sc.e+'</div>'
      +'<div><div class="cand-name">'+esc(c.nome)+'</div>'
      +'<div class="cand-meta">'+esc(c.praca||'—')+' · '+esc(c.nivel||'—')+(c.hunter?' · '+esc(c.hunter):'')+'</div></div>'
      +'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+sc.bg+';color:'+sc.cor+';">'+sc.label+'</span></div>';
  });
}
