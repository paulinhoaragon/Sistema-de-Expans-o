<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus · Relatório CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="pipeline.js"></script>
<script src="config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A0F1E;--cobalt:#1A3BAD;--cobalt-br:#2952E3;--cobalt-gl:#4A70F5;
  --gold:#B8962E;--g:#16A34A;--am:#B45309;--red:#DC2626;--purple:#7C3AED;
  --canvas:#ECEEF6;--surface:#fff;--rule:#E2E5F0;
  --t1:#0A0F1E;--t2:#3A4268;--t3:#7A82A8;--t4:#A8B0CC;
  --r8:8px;--r12:12px;
  --sh:0 1px 3px rgba(10,15,30,.06),0 4px 14px rgba(10,15,30,.06);
  --sh-hover:0 2px 8px rgba(10,15,30,.1),0 8px 24px rgba(10,15,30,.08);
  --gap:16px;
}

body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased;}
.page{padding:24px 28px 40px;max-width:1280px;margin:0 auto;}

/* ── Cover ── */
.cover{background:var(--ink);padding:20px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.cover-title{font-family:'Playfair Display',serif;font-size:20px;color:#fff;letter-spacing:-.01em;}
.cover-sub{font-size:9px;color:rgba(255,255,255,.35);margin-top:3px;letter-spacing:.12em;text-transform:uppercase;}
.cover-rule{height:2px;background:linear-gradient(90deg,var(--cobalt-gl),var(--gold),transparent);}

/* ── Seção labels ── */
.sec{margin-bottom:var(--gap);}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;}
.sec-label::before{content:'';display:inline-block;width:3px;height:10px;border-radius:2px;background:var(--cobalt);flex-shrink:0;}

/* ── Grid system unificado ── */
.row{display:grid;gap:var(--gap);margin-bottom:var(--gap);}
.row.cols-4{grid-template-columns:repeat(4,1fr);}
.row.cols-3{grid-template-columns:repeat(3,1fr);}
.row.cols-2{grid-template-columns:1fr 1fr;}
.row.cols-1{grid-template-columns:1fr;}
/* span helpers */
.span-2{grid-column:span 2;}
.span-3{grid-column:span 3;}
@media(max-width:960px){.row.cols-4,.row.cols-3,.row.cols-2{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.row.cols-4,.row.cols-3,.row.cols-2{grid-template-columns:1fr;}.span-2,.span-3{grid-column:span 1;}}

/* ── Cards ── */
.card{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);}
.card-title{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;}

/* ── KPIs ── */
.kpi{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);border-top:2px solid var(--cobalt);display:flex;flex-direction:column;}
.kpi.g{border-top-color:var(--g)}.kpi.gold{border-top-color:var(--gold)}.kpi.am{border-top-color:var(--am)}.kpi.red{border-top-color:var(--red)}.kpi.purple{border-top-color:var(--purple)}
.kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.kpi-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--t1);line-height:1;margin-bottom:auto;}
.kpi-sub{font-size:10px;color:var(--t4);margin-top:6px;line-height:1.4;}

/* ── KPI distribuição de etapas (4 mini-blocos) ── */
.kpi-dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.kpi-dist-item{border-radius:8px;padding:8px 6px;text-align:center;}
.kpi-dist-val{font-size:20px;font-weight:700;line-height:1;}
.kpi-dist-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}

/* ── Barras ── */
.bar-row{margin-bottom:8px;}
.bar-row:last-child{margin-bottom:0;}
.bar-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:3px;}
.bar-track{background:#EEF1FA;border-radius:4px;height:5px;}
.bar-fill{height:5px;border-radius:4px;transition:width .4s ease;}

/* ── Tags/badges ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;}
.t-neg{background:#FEF3C7;color:#92400E}.t-cont{background:#EEF2FD;color:#1A3BAD}
.t-trab{background:#DCFCE7;color:#15803D}.t-dec{background:#FEE2E2;color:#991B1B}
.t-risco{background:#FEE2E2;color:#991B1B}.t-atenc{background:#FEF3C7;color:#92400E}.t-ok{background:#DCFCE7;color:#15803D}

/* ── Candidatos ── */
.cand-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);}
.cand-row:last-child{border-bottom:none;}
.cand-avatar{width:26px;height:26px;border-radius:50%;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#1A3BAD;flex-shrink:0;}
.cand-name{font-size:12px;font-weight:600;color:var(--t1);flex:1;}
.cand-meta{font-size:10px;color:var(--t3);}

/* ── Card accent (borda lateral) ── */
.card-accent{background:var(--surface);border-radius:0 var(--r12) var(--r12) 0;border-left:3px solid var(--cobalt);padding:14px 16px;box-shadow:var(--sh);}
.card-accent.red{border-left-color:var(--red);}
.card-accent.am{border-left-color:var(--am);}
.card-accent.blue{border-left-color:var(--cobalt);}

/* ── Expandir ── */
.btn-expand{display:flex;align-items:center;gap:5px;margin-top:10px;padding:4px 0;font-size:11px;font-weight:600;color:var(--cobalt);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .15s;}
.btn-expand:hover{color:var(--cobalt-br);}

/* ── Tabela hunters ── */
.htable{width:100%;border-collapse:collapse;font-size:12px;}
.htable th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:7px 12px;border-bottom:2px solid var(--rule);text-align:left;white-space:nowrap;}
.htable td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
.htable tbody tr:last-child td{border-bottom:none;}
.htable tbody tr:hover td{background:#F8F9FE;}
.htable td:first-child{font-weight:600;color:var(--t1);}

/* ── Loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--t4);}
.loading-icon{font-size:36px;margin-bottom:12px;}

/* ── Filtros contratação ── */
.filtros-cont{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.filtros-cont button{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--rule);background:var(--canvas);color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .15s;}
.filtros-cont button.ativo{background:var(--cobalt);color:#fff;border-color:var(--cobalt);}

/* ── Stat box (rodapés) ── */
.stat-box{border-radius:8px;padding:10px 14px;text-align:center;flex:1;}
.stat-box-val{font-size:22px;font-weight:700;line-height:1;}
.stat-box-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-top:3px;}
/* ── Barra de filtro por Perfil de Contratação (mesmo padrão do Jornada) ── */
.fbar{background:var(--surface);border-bottom:1px solid var(--rule);padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fbar-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);}
.seg{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:10px}
.seg button{border:none;background:transparent;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap}
.seg button:hover{color:var(--cobalt)}
.seg button.on{background:var(--cobalt);color:#fff;box-shadow:0 1px 4px rgba(26,59,173,.3)}

/* ── Multi-seleção de Praça ── */
.ms{position:relative;display:inline-block;}
.ms-btn{padding:7px 14px;border:none;background:transparent;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;border-radius:7px;cursor:pointer;white-space:nowrap;}
.ms-btn.ms-active{background:var(--cobalt);color:#fff;}
.ms-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(10,15,30,.14);z-index:500;min-width:220px;max-height:300px;overflow-y:auto;padding:6px 0;}
.ms-panel.open{display:block;}
.ms-panel label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--t1);cursor:pointer;white-space:nowrap;}
.ms-panel label:hover{background:#F4F6FB;}
.ms-actions{display:flex;justify-content:space-between;padding:7px 12px 4px;border-top:1px solid var(--rule);margin-top:4px;}
.ms-actions button{background:none;border:none;color:var(--cobalt);font-size:11px;font-weight:700;cursor:pointer;padding:0;}
.ms-actions button:hover{text-decoration:underline;}

/* ── Crescimento do Pipeline ── */
.cresc-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);}
.cresc-row:last-child{border-bottom:none;}
.cresc-lbl{font-size:12px;color:var(--t2);white-space:nowrap;min-width:110px;}
.cresc-track{background:var(--canvas);border-radius:5px;height:18px;position:relative;overflow:hidden;}
.cresc-fill{background:var(--cobalt);height:100%;border-radius:5px;transition:width .2s;}
.cresc-val{font-size:13px;font-weight:700;color:var(--t1);min-width:28px;text-align:right;}
.cresc-delta{font-size:11px;font-weight:700;min-width:70px;text-align:right;white-space:nowrap;}
.cresc-delta.up{color:#16A34A;}
.cresc-delta.down{color:#DC2626;}
.cresc-delta.flat{color:var(--t4);}
</style>
</head>
<body>

<div class="cover">
  <div>
    <div class="cover-title">Relatório CRM</div>
    <div class="cover-sub">Pipeline de Candidatos · Blue3 Expansão</div>
  </div>
  <div style="text-align:right;">
    <div style="font-size:11px;color:rgba(255,255,255,.45);" id="crm-updated">Carregando...</div>
    <div style="font-size:10px;color:rgba(255,255,255,.25);margin-top:2px;">Confidencial</div>
  </div>
</div>
<div class="cover-rule"></div>

<div class="fbar">
  <span class="fbar-lbl">Perfil de Contratação</span>
  <div class="seg" id="seg-area">
    <button class="on" data-area="">Todos</button>
    <button data-area="assessor">Assessores</button>
    <button data-area="vem ser blue">Vem Ser Blue</button>
    <button data-area="future">Blue3 Future</button>
    <button data-area="planejador/consultor">Planejadores</button>
    <button data-area="__outras">Demais áreas</button>
  </div>
  <span class="fbar-lbl" style="margin-left:8px;">Praça</span>
  <div class="ms" id="ms-praca">
    <button type="button" class="ms-btn" onclick="msPracaToggleOpen()">Todas as praças</button>
    <div class="ms-panel" id="ms-panel-praca"></div>
  </div>
</div>

<div class="page" id="crm-root">
  <div class="loading">
    <div class="loading-icon">⏳</div>
    <div style="font-size:14px;font-weight:600;color:var(--t2);">Carregando dados do CRM...</div>
  </div>
</div>

<script>
var SUPA_URL='https://cjimsplgxrwkqgzegnkq.supabase.co';
var SUPA_KEY='sb_publishable_m4pgWOuDEQghiA2w4_axzg_HccJZxDS';
function supa(p){return fetch(SUPA_URL+'/rest/v1/'+p,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'}}).then(function(r){return r.json();});}
function norm(s){return String(s||'').trim().toLowerCase();}
function pct(a,b){return b>0?Math.round(a/b*100)+'%':'—';}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function diasAtras(d){if(!d)return null;return Math.floor((Date.now()-new Date(d).getTime())/(1000*60*60*24));}
function fmt(n){if(!n||n===0)return'—';var a=Math.abs(n);if(a>=1e9)return'R$'+(n/1e9).toFixed(1).replace('.',',')+'B';if(a>=1e6)return'R$'+(n/1e6).toFixed(1).replace('.',',')+'M';if(a>=1e3)return'R$'+Math.round(n/1e3)+'K';return'R$'+n;}

var ETAPA_COR={'Prospecção':'#94A3B8','Qualificação':'#7C3AED','Negociação':'#B45309','Contratação':'#1A3BAD','Trabalhando':'#16A34A','Declinou':'#DC2626','Contato Futuro':'#0891B2'};

// ── Helpers de render ────────────────────────────────────────
function avatar(nome){
  var p=(nome||'').split(' ');
  var ini=(p[0]?p[0][0]:'')+(p[1]?p[1][0]:'');
  return '<div class="cand-avatar">'+ini.toUpperCase()+'</div>';
}

function barRow(lbl,val,total,cor){
  var p=total>0?Math.round(val/total*100):0;
  return '<div class="bar-row">'
    +'<div class="bar-row-hd"><span style="color:var(--t2);">'+esc(lbl)+'</span>'
    +'<span style="font-weight:600;color:var(--t1);">'+val+' <span style="font-weight:400;color:var(--t4);">('+p+'%)</span></span></div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+cor+';"></div></div>'
    +'</div>';
}

function listaCands(arr, TOP, idBase, buildRow) {
  var visible = arr.slice(0, TOP);
  var hidden  = arr.slice(TOP);
  var html = visible.map(buildRow).join('');
  if (hidden.length) {
    var bid = idBase+'-extra';
    html += '<div id="'+bid+'" style="display:none;">'+hidden.map(buildRow).join('')+'</div>';
    html += '<button class="btn-expand" onclick="(function(b){var el=document.getElementById(\''+bid+'\');var open=el.style.display!==\'none\';el.style.display=open?\'none\':\'block\';b.textContent=open?\'▸ Ver mais '+hidden.length+' candidatos\':\'▴ Ocultar\';})(this)">▸ Ver mais '+hidden.length+' candidatos</button>';
  }
  return html;
}

function scoreRisco(c){
  var ancordOk=['aprovada','isento'].indexOf((c.status_ancord||'').toLowerCase())>-1;
  if(ancordOk)return{e:'✅',label:'Pronto onboarding',cor:'#16A34A',bg:'#DCFCE7'};
  var mouOk=norm(c.mou)==='assinado';
  if(!mouOk)return{e:'🔴',label:'Sem MOU',cor:'#DC2626',bg:'#FEE2E2'};
  if(c.data_mou){
    var d=Math.round((Date.now()-new Date(c.data_mou))/(1000*60*60*24));
    if(d>90)return{e:'🔴',label:'Prazo expirado ('+d+'d)',cor:'#DC2626',bg:'#FEE2E2'};
    if(d>60)return{e:'🟡',label:'Prazo adicional ('+d+'d)',cor:'#B45309',bg:'#FEF3C7'};
    return{e:'🟢',label:'No prazo ('+d+'d)',cor:'#16A34A',bg:'#DCFCE7'};
  }
  return{e:'🟡',label:'MOU sem data',cor:'#B45309',bg:'#FEF3C7'};
}

// ── RENDER PRINCIPAL ─────────────────────────────────────────
function renderCRM(cands){
  var root=document.getElementById('crm-root');
  var upd=document.getElementById('crm-updated');
  if(upd) upd.textContent='Atualizado '+new Date().toLocaleDateString('pt-BR');

  if(!cands||!cands.length){
    root.innerHTML='<div class="loading"><div class="loading-icon">📭</div><div>Nenhum candidato encontrado.</div></div>';
    return;
  }

  // ── Segmentações ──
  var ativos     = cands.filter(function(c){return c.etapa==='Trabalhando'||c.etapa==='Contratação';});
  var trabalhando= cands.filter(function(c){return c.etapa==='Trabalhando';});
  var negociacao = cands.filter(function(c){return c.etapa==='Negociação';});
  var contratacao= cands.filter(function(c){return c.etapa==='Contratação';});
  var declinados = cands.filter(function(c){return c.etapa==='Declinou';});
  var total=cands.length;

  // ── Senioridade ──
  var senMap={senior:0,pleno:0,junior:0};
  ativos.forEach(function(c){var s=norm(c.nivel||'');if(s==='sênior')senMap.senior++;else if(s==='pleno')senMap.pleno++;else if(s==='júnior'||s==='junior')senMap.junior++;});

  // ── Praças ──
  var pracaMap={};
  ativos.forEach(function(c){var p=c.praca||'N/I';pracaMap[p]=(pracaMap[p]||0)+1;});
  var pracasTop=Object.keys(pracaMap).sort(function(a,b){return pracaMap[b]-pracaMap[a];});

  // ── Hunters ──
  var hunterMap={};
  cands.forEach(function(c){
    if(!c.hunter)return;
    var h=c.hunter.trim();
    if(!hunterMap[h])hunterMap[h]={total:0,ativos:0,trab:0,neg:0,dec:0,auc:0};
    hunterMap[h].total++;
    if(c.etapa==='Trabalhando'||c.etapa==='Contratação')hunterMap[h].ativos++;
    if(c.etapa==='Trabalhando')hunterMap[h].trab++;
    if(c.etapa==='Negociação')hunterMap[h].neg++;
    if(c.etapa==='Declinou')hunterMap[h].dec++;
    hunterMap[h].auc+=(parseFloat(c.auc_mm)||0);
  });

  // ── Origens ──
  var instMap={};
  cands.forEach(function(c){
    if(!c.instituicao)return;
    var k=c.instituicao.trim();
    if(!instMap[k])instMap[k]={total:0,ativos:0,dec:0};
    instMap[k].total++;
    if(c.etapa==='Trabalhando'||c.etapa==='Contratação')instMap[k].ativos++;
    if(c.etapa==='Declinou')instMap[k].dec++;
  });
  var instTop=Object.keys(instMap).sort(function(a,b){return instMap[b].total-instMap[a].total;}).slice(0,8);

  // ── MOU pendente ──
  var semMOU=ativos.filter(function(c){return norm(c.mou)!=='assinado';})
    .sort(function(a,b){return (diasAtras(a.data_entrada)||0)-(diasAtras(b.data_entrada)||0);}).reverse();

  // ── Sem movimentação (travados) ──
  var LIMIAR={'Negociação':30,'Contratação':45};
  var travados=cands.filter(function(c){
    var lim=LIMIAR[c.etapa]; if(!lim)return false;
    var d=diasAtras(c.data_entrada); return d!==null&&d>=lim;
  }).sort(function(a,b){return(diasAtras(b.data_entrada)||0)-(diasAtras(a.data_entrada)||0);});

  // ── Precisam de contato ──
  var LIMIAR_CONTATO=14;
  function ultimoContato(c){
    var raw=c.comentarios||''; if(!raw.trim())return null;
    var blocos=raw.split('\n---\n');
    var datas=blocos.map(function(b){var m=b.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(m[3]+'-'+m[2]+'-'+m[1]).getTime():null;}).filter(Boolean);
    return datas.length?Math.max.apply(null,datas):null;
  }
  var pipeAtivo=cands.filter(function(c){return['Negociação','Contratação'].indexOf(c.etapa)>-1;});
  var semContato=pipeAtivo.filter(function(c){
    var uc=ultimoContato(c);
    if(!uc)return true;
    return Math.floor((Date.now()-uc)/(1000*60*60*24))>LIMIAR_CONTATO;
  }).sort(function(a,b){
    var ua=ultimoContato(a), ub=ultimoContato(b);
    return (ua||0)-(ub||0);
  });

  // ── Estratégicos ──
  var estrat=cands.filter(function(c){return norm(c.estrategico)==='sim';});
  var aucEstrat=estrat.filter(function(c){return c.etapa==='Trabalhando'||c.etapa==='Contratação';}).reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── AuC contratado (trabalhando + contratação, somente vaga Assessor) ──
  var ativosAssessor=ativos.filter(function(c){return norm(c.vaga||'').indexOf('assessor')>-1;});
  var aucContratado=ativosAssessor.reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── AuC em negociação ──
  var aucNegociacao=negociacao.reduce(function(s,c){return s+(parseFloat(c.auc_mm)||0);},0);

  // ── Top líderes (somente vaga Assessor) ──
  var liderMap={};
  cands.filter(function(c){
    var v=norm(c.vaga||'');
    return v.indexOf('assessor')>-1&&c.lider&&c.lider.trim();
  }).forEach(function(c){
    var l=c.lider.trim();
    if(!liderMap[l])liderMap[l]={total:0,ativos:0};
    liderMap[l].total++;

      (function(){
        var html='<div class="card"><div class="card-title">Origem institucional <span style="font-weight:400;color:var(--t4);">top '+instTop.length+'</span></div>';
        var maxT=instMap[instTop[0]]?instMap[instTop[0]].total:1;
        html+=listaCands(instTop,5,'inst-lista',function(inst){
          var d=instMap[inst];
          var p=Math.round(d.total/maxT*100);
          return'<div class="bar-row">'
            +'<div class="bar-hd"><span style="color:var(--t2);font-weight:500;">'+esc(inst)+'</span>'
              +'<span style="font-weight:600;color:var(--t1);">'+d.total+'<span style="font-weight:400;color:var(--t4);"> · '+pct(d.ativos,d.total)+' conv.</span></span></div>'
            +'<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:var(--cobalt);"></div></div>'
            +'</div>';
        });
        return html+'</div>';
      })(),

      (function(){
        if(!estrat.length)return'<div class="card"><div class="card-title">Estratégicos</div><div style="padding:12px 0;text-align:center;font-size:12px;color:var(--t4);">Nenhum estratégico marcado</div></div>';
        var rows=listaCands(estrat,4,'estrat-lista',function(c){
          var auc=parseFloat(c.auc_mm)||0;
          var etBg={'Trabalhando':'#DCFCE7','Contratação':'#EEF2FD','Negociação':'#FEF3C7','Declinou':'#FEE2E2'};
          var etCor={'Trabalhando':'#15803D','Contratação':'#1A3BAD','Negociação':'#92400E','Declinou':'#991B1B'};
          return'<div class="cand-row">'+avatar(c.nome)
            +'<div><div class="cand-name">'+esc(c.nome)+'</div>'
            +'<div class="cand-meta">'+esc(c.praca||'—')+(auc?' · '+auc+'MM':'')+'</div></div>'
            +'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+(etBg[c.etapa]||'#F1F5F9')+';color:'+(etCor[c.etapa]||'#475569')+';">'+esc(c.etapa)+'</span></div>';
        });
        return'<div class="card">'
          +'<div class="card-title">Estratégicos <span style="font-weight:400;color:var(--t4);">('+estrat.length+')</span></div>'
          +'<div style="margin-bottom:12px;padding:10px 14px;background:#FFFBEB;border-radius:var(--r8);border:1px solid #FDE68A;">'
            +'<div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:3px;">AuC estratégico confirmado</div>'
            +'<div style="font-size:20px;font-weight:700;color:var(--gold);">'+fmt(aucEstrat*1e6)+'</div>'
          +'</div>'
          +rows+'</div>';
      })(),

    '</div>',

    // ⑥ RANKING DE LÍDERES — contratações por líder (vaga Assessor)
    '<div class="sec-label">Ranking de líderes · contratações</div>',
    (function(){
      if(!lideresRank.length) return '<div style="font-size:12px;color:var(--t4);padding:8px 0;">Sem dados de líder.</div>';
      var maxAtivos = liderMap[lideresRank[0]].ativos || 1;
      var total = lideresRank.length;

      function linha(l, pos){
        var d=liderMap[l];
        var pct = Math.round((d.ativos/maxAtivos)*100);
        var medalha = pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'<span style="display:inline-block;width:20px;text-align:center;color:var(--t4);font-size:10px;">'+pos+'º</span>';
        var zerado = d.ativos===0;
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);'+(zerado?'opacity:.7;':'')+'">'
          + '<div style="width:22px;flex-shrink:0;font-size:13px;">'+medalha+'</div>'
          + '<div style="flex:1;min-width:0;">'
          +   '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">'
          +     '<span style="font-size:12px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(l)+(zerado?' <span style="font-size:9px;font-weight:700;color:#B91C1C;background:#FEE2E2;padding:1px 6px;border-radius:8px;margin-left:4px;">sem contratação</span>':'')+'</span>'
          +     '<span style="font-size:12px;font-weight:700;color:var(--cobalt);flex-shrink:0;margin-left:8px;">'+d.ativos+'<span style="font-weight:400;color:var(--t4);font-size:10px;"> / '+d.total+' no funil</span></span>'
          +   '</div>'
          +   '<div style="height:4px;background:var(--rule);border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(zerado?'#FCA5A5':'var(--cobalt)')+';border-radius:3px;"></div></div>'
          + '</div>'
          + '</div>';
      }

      // Cortes: Top 3 sempre visível; Top 4-10 e o resto em blocos expansíveis
      var top3 = lideresRank.slice(0,3);
      var top10 = lideresRank.slice(3,10);
      var resto = lideresRank.slice(10);

      var html = '<div style="background:#fff;border:1px solid var(--rule);border-radius:var(--r12);padding:14px 16px;">';
      // contador
      html += '<div style="font-size:10px;color:var(--t3);margin-bottom:8px;">'+total+' líderes · ordenados por contratações ativas (Trabalhando + Contratação)</div>';
      // Top 3
      top3.forEach(function(l,i){ html += linha(l, i+1); });

      // Bloco Top 4-10
      if(top10.length){
        html += '<div id="rk-top10" style="display:none;">';
        top10.forEach(function(l,i){ html += linha(l, i+4); });
        html += '</div>';
      }
      // Bloco resto (11+)
      if(resto.length){
        html += '<div id="rk-resto" style="display:none;">';
        resto.forEach(function(l,i){ html += linha(l, i+11); });
        html += '</div>';
      }

      // Botões de corte
      if(top10.length || resto.length){
        html += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">';
        if(top10.length){
          html += '<button id="rk-btn-top10" onclick="_rkToggle(\'top10\')" style="font-size:11px;font-weight:600;color:var(--cobalt);background:#EEF2FD;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;">▸ Ver Top 10</button>';
        }
        if(resto.length){
          html += '<button id="rk-btn-resto" onclick="_rkToggle(\'resto\')" style="font-size:11px;font-weight:600;color:var(--t2);background:var(--canvas,#F4F6FB);border:1px solid var(--rule);border-radius:8px;padding:6px 12px;cursor:pointer;">▸ Ver todos ('+total+')</button>';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    })(),

    '</div>',

  ].join('');
}

// ── filtCont inline ──────────────────────────────────────────
function filtCont(btn, filtro){
  document.querySelectorAll('#filt-cont-btns button').forEach(function(b){b.classList.remove('ativo');});
  btn.classList.add('ativo');
  var mapa={todos:null,pronto:'✅',risco:'🔴',atencao:'🟡',prazo:'🟢'};
  var sorted=window._crmContSorted||[];
  var lista=mapa[filtro]?sorted.filter(function(c){return scoreRisco(c).e===mapa[filtro];}):sorted;
  var body=document.getElementById('cont-body');
  if(!body)return;
  if(!lista.length){body.innerHTML='<div style="padding:16px;text-align:center;font-size:12px;color:var(--t4);">Nenhum candidato neste filtro</div>';return;}
  body.innerHTML=listaCands(lista,5,'cont-lista-dyn',function(c){
    var sc=scoreRisco(c);
    return'<div class="cand-row"><div style="font-size:15px;flex-shrink:0;">'+sc.e+'</div>'
      +'<div><div class="cand-name">'+esc(c.nome)+'</div>'
      +'<div class="cand-meta">'+esc(c.praca||'—')+' · '+esc(c.nivel||'—')+(c.hunter?' · '+esc(c.hunter):'')+'</div></div>'
      +'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+sc.bg+';color:'+sc.cor+';">'+sc.label+'</span></div>';
  });
}

// ── Segmentação por Perfil de Contratação (mesmos buckets do Jornada) ──
var _TODOS_CANDS = [];
var _AREA_ATUAL = '';
var MS_PRACA = new Set();
var _MODO_CRESC = 'semana'; // 'semana' | 'mes'
var _PRACAS_CAD = []; // cadastro central de praças (NexusConfig.getPracas) — usado só pra traduzir nome->rótulo

// Traduz o "nome canônico" salvo no candidato (ex: "Blue3 Future") para o
// Rótulo Curto cadastrado (ex: "Future – Ribeirão Preto"). Sem isso, praças
// com nome canônico parecido (ex: "Blue3 Future" vs "Blue3 – Future") ficam
// visualmente quase idênticas e difíceis de diferenciar no filtro.
function pracaLabel(nomeCanonico) {
  if (!nomeCanonico) return '';
  var achou = _PRACAS_CAD.find(function(p){ return p.nome === nomeCanonico; });
  if (achou && achou.label) return achou.label;
  return nomeCanonico.replace(/^Blue3\s*[-–]\s*/i,'');
}

function areaDe(c){ return (c.vaga||'').toLowerCase().trim(); }
function naArea(c, area){
  if (!area) return true; // "Todos" — sem filtro
  var v = areaDe(c);
  if (area === '__outras') return v!=='assessor' && v!=='vem ser blue' && v!=='future' && v!=='planejador/consultor';
  return v === area;
}
function naPracaSel(c){
  if (!MS_PRACA.size) return true;
  return MS_PRACA.has(c.praca||'');
}

function aplicarFiltrosCRM() {
  var filtrados = _TODOS_CANDS.filter(function(c){ return naArea(c, _AREA_ATUAL) && naPracaSel(c); });
  renderCRM(filtrados);
}

// ── Multi-seleção de Praça (opções vêm de TODOS os candidatos, não só os filtrados) ──
function popularFiltroPraca() {
  var pracas = {};
  _TODOS_CANDS.forEach(function(c){ var p=(c.praca||'').trim(); if(p) pracas[p]=true; });
  var lista = Object.keys(pracas).sort(function(a,b){ return pracaLabel(a).localeCompare(pracaLabel(b)); });
  var panel = document.getElementById('ms-panel-praca');
  if (!panel) return;
  var html = lista.map(function(p){
    var checked = MS_PRACA.has(p) ? ' checked' : '';
    return '<label><input type="checkbox" value="'+esc(p)+'"'+checked+' onchange="msPracaToggle(this.value,this.checked)"> '+esc(pracaLabel(p))+'</label>';
  }).join('');
  html += '<div class="ms-actions"><button type="button" onclick="msPracaLimpar()">Limpar</button><button type="button" onclick="msPracaFecharTodos()">Fechar</button></div>';
  panel.innerHTML = html || '<div style="padding:10px 12px;font-size:11px;color:var(--t4);">Nenhuma praça encontrada</div>';
  msPracaAtualizarLabel();
}
function msPracaToggle(value, checked) {
  if (checked) MS_PRACA.add(value); else MS_PRACA.delete(value);
  msPracaAtualizarLabel();
  aplicarFiltrosCRM();
}
function msPracaLimpar() {
  MS_PRACA.clear();
  var panel = document.getElementById('ms-panel-praca');
  if (panel) panel.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked = false; });
  msPracaAtualizarLabel();
  aplicarFiltrosCRM();
}
function msPracaAtualizarLabel() {
  var btn = document.querySelector('#ms-praca .ms-btn');
  if (!btn) return;
  if (!MS_PRACA.size) { btn.textContent = 'Todas as praças'; btn.classList.remove('ms-active'); return; }
  if (MS_PRACA.size === 1) {
    var v = MS_PRACA.values().next().value;
    btn.textContent = pracaLabel(v);
  } else {
    btn.textContent = MS_PRACA.size + ' praças';
  }
  btn.classList.add('ms-active');
}
function msPracaToggleOpen() {
  var painel = document.getElementById('ms-panel-praca');
  var estava = painel.classList.contains('open');
  msPracaFecharTodos();
  if (!estava) painel.classList.add('open');
}
function msPracaFecharTodos() {
  document.querySelectorAll('.ms-panel.open').forEach(function(p){ p.classList.remove('open'); });
}
document.addEventListener('click', function(e){
  if (!e.target.closest('.ms')) msPracaFecharTodos();
});

// ── Crescimento do Pipeline (novos cadastros por semana ou mês) ──
function _inicioSemana(d) {
  var dia = (d.getDay()+6)%7; // 0=segunda
  var seg = new Date(d);
  seg.setDate(d.getDate()-dia);
  seg.setHours(0,0,0,0);
  return seg;
}
function _fmtSemanaLbl(iso) {
  var d = new Date(iso+'T12:00:00');
  var fim = new Date(d); fim.setDate(d.getDate()+6);
  var f = function(x){ return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0'); };
  return f(d)+'–'+f(fim);
}
function _fmtMesLbl(chave) {
  var partes = chave.split('-');
  var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return meses[parseInt(partes[1],10)-1]+'/'+partes[0].slice(2);
}

function toggleModoCresc(modo) {
  _MODO_CRESC = modo;
  aplicarFiltrosCRM();
}

function renderCrescimentoPipeline(cands) {
  var buckets = {};
  cands.forEach(function(c){
    if (!c.data_entrada) return;
    var d = new Date(c.data_entrada+'T12:00:00');
    if (isNaN(d.getTime())) return;
    var chave = (_MODO_CRESC === 'semana')
      ? _inicioSemana(d).toISOString().slice(0,10)
      : d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    buckets[chave] = (buckets[chave]||0)+1;
  });

  var chaves = Object.keys(buckets).sort();
  var JANELA = _MODO_CRESC === 'semana' ? 8 : 6;
  var visiveis = chaves.slice(-JANELA);

  if (!visiveis.length) {
    return '<div class="card"><div class="card-title">Crescimento do Pipeline</div><div style="padding:20px;text-align:center;color:var(--t4);font-size:12px;">Sem datas de cadastro suficientes para este filtro.</div></div>';
  }

  var maxVal = Math.max.apply(null, visiveis.map(function(k){ return buckets[k]; }));
  var linhas = visiveis.map(function(k, i){
    var atual = buckets[k];
    var chaveAnterior = chaves[chaves.indexOf(k)-1]; // período anterior real, mesmo fora da janela visível
    var anterior = chaveAnterior ? (buckets[chaveAnterior]||0) : null;
    var largura = maxVal>0 ? Math.round(atual/maxVal*100) : 0;
    var deltaHtml = '<span class="cresc-delta flat">—</span>';
    if (anterior !== null) {
      var delta = atual - anterior;
      var cls = delta>0 ? 'up' : (delta<0 ? 'down' : 'flat');
      var seta = delta>0 ? '▲' : (delta<0 ? '▼' : '＝');
      var pctTxt = anterior>0 ? ' ('+(delta>=0?'+':'')+Math.round(delta/anterior*100)+'%)' : '';
      deltaHtml = '<span class="cresc-delta '+cls+'">'+seta+' '+(delta>0?'+':'')+delta+pctTxt+'</span>';
    }
    var lbl = _MODO_CRESC === 'semana' ? _fmtSemanaLbl(k) : _fmtMesLbl(k);
    return '<div class="cresc-row">'
      + '<div class="cresc-lbl">'+esc(lbl)+'</div>'
      + '<div class="cresc-track"><div class="cresc-fill" style="width:'+largura+'%;"></div></div>'
      + '<div class="cresc-val">'+atual+'</div>'
      + deltaHtml
    + '</div>';
  }).join('');

  var totalJanela = visiveis.reduce(function(s,k){ return s+buckets[k]; }, 0);
  var filtroTxt = (_AREA_ATUAL ? (document.querySelector('#seg-area button.on')||{}).textContent : 'Todos') + (MS_PRACA.size ? ' · '+(MS_PRACA.size===1?pracaLabel([...MS_PRACA][0]):MS_PRACA.size+' praças') : '');

  return '<div class="card">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      + '<div class="card-title" style="margin-bottom:0;">Crescimento do Pipeline</div>'
      + '<div class="seg" style="padding:2px;">'
        + '<button class="'+(_MODO_CRESC==='semana'?'on':'')+'" onclick="toggleModoCresc(\'semana\')" style="font-size:10px;padding:5px 10px;">Semanal</button>'
        + '<button class="'+(_MODO_CRESC==='mes'?'on':'')+'" onclick="toggleModoCresc(\'mes\')" style="font-size:10px;padding:5px 10px;">Mensal</button>'
      + '</div>'
    + '</div>'
    + '<div style="font-size:10px;color:var(--t3);margin-bottom:10px;">Novos cadastros no funil · filtro atual: '+esc(filtroTxt)+' · '+totalJanela+' no total do período exibido</div>'
    + linhas
  + '</div>';
}

// ── Inicialização ─────────────────────────────────────────────
(function(){
  Promise.all([
    supa('crm_candidatos?order=criado_em.desc&limit=500&select=id,nome,etapa,nivel,vaga,praca,hunter,lider,mou,data_mou,status_ancord,data_entrada,data_inicio,prev_inicio,data_declinio,auc_mm,piso,periodo,instituicao,estrategico,historico_etapas,comentarios'),
    new Promise(function(resolve){
      if (typeof NexusConfig === 'undefined' || typeof NexusConfig.getPracas !== 'function') { resolve([]); return; }
      NexusConfig.getPracas(function(err, pracas){ resolve(err ? [] : (pracas||[])); });
    })
  ])
    .then(function(res){
      _TODOS_CANDS = res[0] || [];
      _PRACAS_CAD = res[1] || [];
      popularFiltroPraca();
      renderCRM(_TODOS_CANDS);
      document.querySelectorAll('#seg-area button').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('#seg-area button').forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          _AREA_ATUAL = b.getAttribute('data-area');
          aplicarFiltrosCRM();
        });
      });
    })
    .catch(function(e){
      document.getElementById('crm-root').innerHTML='<div class="loading"><div class="loading-icon">❌</div><div>Erro ao carregar: '+e+'</div></div>';
    });
})();

// Toggle dos cortes do ranking de líderes
function _rkToggle(qual){
  if(qual==='top10'){
    var el=document.getElementById('rk-top10');
    var btn=document.getElementById('rk-btn-top10');
    if(!el) return;
    var abrir = el.style.display==='none';
    el.style.display = abrir?'block':'none';
    if(btn) btn.innerHTML = abrir?'▴ Ocultar Top 10':'▸ Ver Top 10';
  } else if(qual==='resto'){
    var elR=document.getElementById('rk-resto');
    var el10=document.getElementById('rk-top10');
    var btnR=document.getElementById('rk-btn-resto');
    var btn10=document.getElementById('rk-btn-top10');
    if(!elR && !el10) return;
    var abrirR = (elR && elR.style.display==='none') || (el10 && el10.style.display==='none');
    if(el10) el10.style.display = abrirR?'block':'none';
    if(elR)  elR.style.display  = abrirR?'block':'none';
    if(btnR) btnR.innerHTML = abrirR?'▴ Ocultar todos':'▸ Ver todos';
    if(btn10 && el10) btn10.innerHTML = el10.style.display==='block'?'▴ Ocultar Top 10':'▸ Ver Top 10';
  }
}
