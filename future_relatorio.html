// ── Por Que Perdemos Candidatos — motivo do declínio × hunter e × praça ──
function renderMotivoDeclinio(C) {
  var declinados = C.filter(function(c){ return c.etapa === 'Declinou' && c.motivo_declinio; });

  if (!declinados.length) {
    return '<div class="card"><div class="sh"><span class="sn">15</span><span class="st">Por Que Perdemos Candidatos</span></div><div style="padding:10px 0;color:var(--t4);font-size:12px;">Nenhum declínio com motivo registrado no filtro atual.</div></div>';
  }

  function agrupar(chaveFn) {
    var mapa = {};
    declinados.forEach(function(c){
      var k = chaveFn(c) || '—';
      if (!mapa[k]) mapa[k] = { reprovou:0, desistiu:0, total:0 };
      mapa[k].total++;
      if (c.motivo_declinio === 'Blue3 Reprovou') mapa[k].reprovou++;
      else if (c.motivo_declinio === 'Desistência') mapa[k].desistiu++;
    });
    return Object.keys(mapa).map(function(k){
      var v = mapa[k];
      v.chave = k;
      v.pctReprovou = Math.round(v.reprovou/v.total*100);
      return v;
    }).sort(function(a,b){ return b.total-a.total; });
  }

  function tabela(titulo, linhasAgrupadas) {
    var corpo = linhasAgrupadas.map(function(v){
      var alerta = v.total >= 3 && v.pctReprovou >= 60;
      return '<tr'+(alerta?' style="background:#FEE2E222;"':'')+'>'
        + '<td style="padding:7px 4px;font-weight:600;">'+(alerta?'⚠️ ':'')+esc(v.chave)+'</td>'
        + '<td style="padding:7px 4px;text-align:center;">'+v.reprovou+'</td>'
        + '<td style="padding:7px 4px;text-align:center;">'+v.desistiu+'</td>'
        + '<td style="padding:7px 4px;text-align:center;">'+v.total+'</td>'
        + '<td style="padding:7px 4px;text-align:right;font-weight:700;color:'+(v.pctReprovou>=60?'#DC2626':'#7A82A8')+';">'+v.pctReprovou+'%</td>'
      + '</tr>';
    }).join('');
    return '<div style="flex:1;min-width:280px;">'
      + '<div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px;">'+titulo+'</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
      + '<thead><tr style="border-bottom:1px solid var(--rule);">'
        + '<th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">'+titulo+'</th>'
        + '<th style="text-align:center;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Reprovou</th>'
        + '<th style="text-align:center;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Desistiu</th>'
        + '<th style="text-align:center;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Total</th>'
        + '<th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">% Reprovou</th>'
      + '</tr></thead><tbody>'+corpo+'</tbody></table>'
    + '</div>';
  }

  var porHunter = agrupar(function(c){ return c.hunter; });
  var porPraca  = agrupar(function(c){ return pracaLabel(c.praca); });

  return '<div class="card"><div class="sh"><span class="sn">15</span><span class="st">Por Que Perdemos Candidatos</span><span class="ss">'+declinados.length+' declínio(s) com motivo registrado · ⚠ = 3+ declínios com 60%+ de reprovação</span></div>'
    + '<div style="display:flex;gap:24px;flex-wrap:wrap;">'
      + tabela('Hunter', porHunter)
      + tabela('Praça', porPraca)
    + '</div>'
    + '<div class="nota" style="margin-top:14px;font-size:10px;color:var(--t3);background:var(--canvas,#F4F6FB);border-radius:8px;padding:9px 12px;line-height:1.6;">📐 <b>Blue3 Reprovou</b> = a empresa não seguiu com o candidato (pode indicar critério de prospecção a ajustar). <b>Desistência</b> = o candidato que desistiu (pode indicar oferta/processo a revisar). Hunter ou praça com muita reprovação concentrada vale uma conversa — pode ser perfil de candidato sendo trazido fora do que qualifica.</div>'
    + '</div>';
}

function renderOrigemLeads(C) {
  var ORIGENS = ['Hunting','Indicação','Inscrição','XP'];
  var porOrigem = {};
  ORIGENS.forEach(function(o){ porOrigem[o] = []; });
  var semOrigem = [];
  C.forEach(function(c){
    var o = c.origem_lead;
    if (o && porOrigem[o]) porOrigem[o].push(c);
    else semOrigem.push(c);
  });

  var linhas = ORIGENS.map(function(o){
    var lista = porOrigem[o];
    return _linhaOrigem(o, lista);
  }).join('');
  var linhaSemOrigem = semOrigem.length ? _linhaOrigem('Não informado', semOrigem) : '';

  return '<div class="card"><div class="sh"><span class="sn">05</span><span class="st">Origem dos Leads</span><span class="ss">De onde vêm os candidatos e taxa de sucesso de cada canal (aprovados+contratados ÷ total)</span></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
    + '<thead><tr style="border-bottom:1px solid var(--rule);"><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Origem</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Total</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Aprovados/Contrat.</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Declinou</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Em andamento</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Taxa de sucesso</th></tr></thead>'
    + '<tbody>' + linhas + linhaSemOrigem + '</tbody></table>'
  + '</div>';
}
function _linhaOrigem(label, lista) {
  var total = lista.length;
  var aprovados = lista.filter(function(c){ return c.etapa === 'Contratação' || c.etapa === 'Trabalhando'; }).length;
  var declinados = lista.filter(function(c){ return c.etapa === 'Declinou'; }).length;
  var andamento = total - aprovados - declinados;
  var taxa = total ? Math.round(aprovados/total*100) : 0;
  var corTaxa = taxa >= 30 ? '#16A34A' : (taxa >= 10 ? '#B45309' : '#7A82A8');
  return '<tr style="border-bottom:1px solid var(--rule);">'
    + '<td style="padding:7px 4px;font-weight:600;">'+esc(label)+'</td>'
    + '<td style="padding:7px 4px;text-align:right;">'+total+'</td>'
    + '<td style="padding:7px 4px;text-align:right;color:#16A34A;">'+aprovados+'</td>'
    + '<td style="padding:7px 4px;text-align:right;color:#DC2626;">'+declinados+'</td>'
    + '<td style="padding:7px 4px;text-align:right;color:var(--t3);">'+andamento+'</td>'
    + '<td style="padding:7px 4px;text-align:right;font-weight:700;color:'+corTaxa+';">'+(total?taxa+'%':'—')+'</td>'
  + '</tr>';
}

// ── Candidatos parados ──
// "Parado" aqui = tempo desde o cadastro (data_entrada), não tempo na etapa atual específica
// (isso exigiria o historico_etapas, que não estou usando por segurança — ver nota acima).
var LIMITE_PARADO = 20;
var PARADOS_LIMITE_INICIAL = 10;
function renderParados(C) {
  var candidatosAtivos = C.filter(function(c){ return FUNIL_SEQ.indexOf(c.etapa) > -1 && c.etapa !== 'Trabalhando' && c.data_entrada; });
  var parados = candidatosAtivos.map(function(c){
    return { c:c, dias: diasEntre(c.data_entrada, null) };
  }).filter(function(x){ return x.dias !== null && x.dias >= LIMITE_PARADO; })
    .sort(function(a,b){ return b.dias - a.dias; });

  if (!parados.length) {
    return '<div class="card"><div class="sh"><span class="sn">07</span><span class="st">Candidatos Parados</span></div><div style="padding:10px 0;color:var(--t4);font-size:12px;">Nenhum candidato há mais de '+LIMITE_PARADO+' dias no funil sem avançar — funil saudável no filtro atual.</div></div>';
  }

  function _linhaParado(x, oculta){
    var info = ETAPA_INFO[x.c.etapa];
    return '<tr class="'+(oculta?'linha-parado-extra':'')+'" style="border-bottom:1px solid var(--rule);'+(oculta?'display:none;':'')+'">'
      + '<td style="padding:7px 4px;font-weight:600;">'+esc(x.c.nome)+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);">'+esc(pracaLabel(x.c.praca))+'</td>'
      + '<td style="padding:7px 4px;"><span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:'+info.cor+'22;color:'+info.cor+';">'+esc(info.lbl)+'</span></td>'
      + '<td style="padding:7px 4px;text-align:right;font-weight:700;color:#DC2626;">'+x.dias+'d</td>'
    + '</tr>';
  }

  var linhasVisiveis = parados.slice(0, PARADOS_LIMITE_INICIAL).map(function(x){ return _linhaParado(x, false); }).join('');
  var linhasOcultas  = parados.slice(PARADOS_LIMITE_INICIAL).map(function(x){ return _linhaParado(x, true); }).join('');
  var restantes = parados.length - PARADOS_LIMITE_INICIAL;

  var botaoExpandir = restantes > 0
    ? '<button id="btn-parados-expandir" onclick="toggleParadosExpandir()" style="margin-top:10px;background:none;border:1px solid var(--rule);border-radius:7px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--cobalt);cursor:pointer;font-family:\'DM Sans\',sans-serif;">Ver todos ('+restantes+' a mais) ▾</button>'
    : '';

  return '<div class="card card-flow"><div class="sh"><span class="sn">07</span><span class="st">Candidatos Parados</span><span class="ss">'+parados.length+' candidato(s) há '+LIMITE_PARADO+'+ dias sem chegar em Trabalhando ou Declinou</span></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
    + '<thead><tr style="border-bottom:1px solid var(--rule);"><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Candidato</th><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Praça</th><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Etapa Atual</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Dias parado</th></tr></thead>'
    + '<tbody>'+linhasVisiveis+linhasOcultas+'</tbody></table>'
    + botaoExpandir
  + '</div>';
}
function toggleParadosExpandir() {
  var btn = document.getElementById('btn-parados-expandir');
  var linhas = document.querySelectorAll('.linha-parado-extra');
  var expandido = btn.getAttribute('data-expandido') === '1';
  linhas.forEach(function(tr){ tr.style.display = expandido ? 'none' : 'table-row'; });
  btn.setAttribute('data-expandido', expandido ? '0' : '1');
  btn.textContent = expandido ? btn.textContent.replace('Ver menos ▴', '') : '';
  if (expandido) {
    btn.textContent = 'Ver todos (' + linhas.length + ' a mais) ▾';
  } else {
    btn.textContent = 'Ver menos ▴';
  }
}

// ── Performance por Hunter ──
function renderHunters(C) {
  var comHunter = C.filter(function(c){ return c.hunter; });
  var porHunter = {};
  comHunter.forEach(function(c){
    var h = c.hunter;
    if (!porHunter[h]) porHunter[h] = { total:0, pracas:{}, etapas:{}, aprovados:0, declinados:0 };
    var reg = porHunter[h];
    reg.total++;
    var p = c.praca || 'Sem praça';
    reg.pracas[p] = (reg.pracas[p]||0)+1;
    reg.etapas[c.etapa] = (reg.etapas[c.etapa]||0)+1;
    if (c.etapa === 'Contratação' || c.etapa === 'Trabalhando') reg.aprovados++;
    if (c.etapa === 'Declinou') reg.declinados++;
  });

  var nomes = Object.keys(porHunter).sort(function(a,b){ return porHunter[b].total - porHunter[a].total; });
  if (!nomes.length) {
    return '<div class="card"><div class="sh"><span class="sn">06</span><span class="st">Performance por Hunter</span></div><div style="padding:10px 0;color:var(--t4);font-size:12px;">Nenhum lead com hunter atribuído no filtro atual.</div></div>';
  }

  var linhas = nomes.map(function(h){
    var reg = porHunter[h];
    var taxa = reg.total ? Math.round(reg.aprovados/reg.total*100) : 0;
    var corTaxa = taxa >= 30 ? '#16A34A' : (taxa >= 10 ? '#B45309' : '#7A82A8');

    var pracasTxt = Object.keys(reg.pracas).sort(function(a,b){ return reg.pracas[b]-reg.pracas[a]; })
      .map(function(p){ return pracaLabel(p==='Sem praça'?'':p)||p; })
      .join(', ');

    var etapasTags = ETAPAS_ORDEM.filter(function(e){ return reg.etapas[e]; }).map(function(e){
      var info = ETAPA_INFO[e];
      return '<span style="display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+info.cor+'22;color:'+info.cor+';margin:1px 3px 1px 0;white-space:nowrap;">'+esc(info.lbl.replace(/^R\d · /,''))+' '+reg.etapas[e]+'</span>';
    }).join('');

    return '<tr style="border-bottom:1px solid var(--rule);vertical-align:top;">'
      + '<td style="padding:8px 4px;font-weight:600;">'+esc(h)+'</td>'
      + '<td style="padding:8px 4px;text-align:center;font-weight:700;">'+reg.total+'</td>'
      + '<td style="padding:8px 4px;color:var(--t3);font-size:11px;">'+esc(pracasTxt)+'</td>'
      + '<td style="padding:8px 4px;">'+etapasTags+'</td>'
      + '<td style="padding:8px 4px;text-align:right;font-weight:700;color:'+corTaxa+';">'+taxa+'%</td>'
    + '</tr>';
  }).join('');

  return '<div class="card card-flow"><div class="sh"><span class="sn">06</span><span class="st">Performance por Hunter</span><span class="ss">Volume, praças, etapas e conversão (aprovados+contratados ÷ total)</span></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
    + '<thead><tr style="border-bottom:1px solid var(--rule);"><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Hunter</th><th style="text-align:center;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Total</th><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Praças</th><th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Distribuição por Etapa</th><th style="text-align:right;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);">Conversão</th></tr></thead>'
    + '<tbody>'+linhas+'</tbody></table>'
  + '</div>';
}

function renderPreWork(C) {
  // Só faz sentido pra quem já passou da Prospecção e ainda não está Trabalhando/Declinou
  var elegiveis = C.filter(function(c){ return ['Qualificação','Negociação','Contratação'].indexOf(c.etapa) > -1; });
  var emPreWorkLista = elegiveis.filter(function(c){ return preWorkStatus(c) === 'em_pre_work'; });
  var emPreWork = emPreWorkLista.length;
  var validado  = elegiveis.filter(function(c){ return preWorkStatus(c) === 'validado'; }).length;
  var naoIniciado = elegiveis.length - emPreWork - validado;
  var total = elegiveis.length || 1;

  var pEm = Math.round(emPreWork/total*100), pVal = Math.round(validado/total*100), pNao = 100-pEm-pVal;

  // Não temos a data de quando o Pré-Work começou — só o status atual. Por isso, uso tempo desde
  // o CADASTRO como proxy (mesma lógica de "Candidatos Parados"), deixando isso explícito no rótulo.
  var diasEmPreWork = emPreWorkLista.map(function(c){ return diasEntre(c.r3_solicitado || c.data_entrada, null); }).filter(function(d){ return d !== null; });
  var mediaPreWork = _mediaDias(diasEmPreWork);
  var avisoTempo = mediaPreWork !== null
    ? '<div style="font-size:11px;color:var(--t3);margin-top:10px;">⏱ Quem está "Em Pré-Work" hoje está nessa fase, em média, há <b style="color:var(--t1);">'+mediaPreWork+' dias</b> (contados da data de solicitação do Pré-Work na jornada; para quem não tem jornada lançada, do cadastro).</div>'
    : '';

  return '<div class="card"><div class="sh"><span class="sn">08</span><span class="st">Status de Pré-Work</span><span class="ss">'+elegiveis.length+' candidato(s) elegível(is) (Qualificação, Negociação ou Contratação)</span></div>'
    + '<div class="prework-bar">'
      + (pNao>0?'<span style="width:'+pNao+'%;background:#A8B0CC;">'+(pNao>=8?naoIniciado:'')+'</span>':'')
      + (pEm>0?'<span style="width:'+pEm+'%;background:#B45309;">'+(pEm>=8?emPreWork:'')+'</span>':'')
      + (pVal>0?'<span style="width:'+pVal+'%;background:#16A34A;">'+(pVal>=8?validado:'')+'</span>':'')
    + '</div>'
    + '<div class="legend">'
      + '<span><span class="dot" style="background:#A8B0CC;"></span>Não iniciado · '+naoIniciado+'</span>'
      + '<span><span class="dot" style="background:#B45309;"></span>Em Pré-Work · '+emPreWork+'</span>'
      + '<span><span class="dot" style="background:#16A34A;"></span>Validado pelo Líder · '+validado+'</span>'
    + '</div>'
    + avisoTempo
  + '</div>';
}

function _inicioSemana(d){ var dia=(d.getDay()+6)%7; var s=new Date(d); s.setDate(d.getDate()-dia); s.setHours(0,0,0,0); return s; }
function _fmtDiaLbl(iso){ var d=new Date(iso+'T12:00:00'); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function _fmtSemanaLbl(iso){ var d=new Date(iso+'T12:00:00'); var f=new Date(d); f.setDate(d.getDate()+6); var ff=function(x){return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');}; return ff(d)+'–'+ff(f); }
function _fmtMesLbl(chave){ var partes=chave.split('-'); var meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return meses[parseInt(partes[1],10)-1]+'/'+partes[0].slice(2); }

function toggleModoCresc(modo){ _MODO_CRESC = modo; aplicarFiltro(); }

function renderCrescimento(C) {
  var buckets = {};
  C.forEach(function(c){
    if (!c.data_entrada) return;
    var d = new Date(c.data_entrada+'T12:00:00');
    if (isNaN(d.getTime())) return;
    var chave;
    if (_MODO_CRESC === 'dia') chave = c.data_entrada;
    else if (_MODO_CRESC === 'semana') chave = _inicioSemana(d).toISOString().slice(0,10);
    else chave = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    buckets[chave] = (buckets[chave]||0)+1;
  });

  var chaves = Object.keys(buckets).sort();
  var JANELA = _MODO_CRESC === 'dia' ? 14 : (_MODO_CRESC === 'semana' ? 8 : 6);
  var visiveis = chaves.slice(-JANELA);

  if (!visiveis.length) {
    return '<div class="card"><div class="sh"><span class="sn">09</span><span class="st">Crescimento da Base</span></div><div style="padding:16px;text-align:center;color:var(--t4);font-size:12px;">Sem datas de cadastro suficientes.</div></div>';
  }

  var maxVal = Math.max.apply(null, visiveis.map(function(k){ return buckets[k]; }));
  var linhas = visiveis.map(function(k){
    var atual = buckets[k];
    var idxReal = chaves.indexOf(k);
    var anteriorKey = chaves[idxReal-1];
    var anterior = anteriorKey!=null ? buckets[anteriorKey] : null;
    var largura = maxVal>0 ? Math.round(atual/maxVal*100) : 0;
    var deltaHtml = '<span class="cresc-delta flat">—</span>';
    if (anterior !== null) {
      var delta = atual - anterior;
      var cls = delta>0?'up':(delta<0?'down':'flat');
      var seta = delta>0?'▲':(delta<0?'▼':'＝');
      var pctTxt = anterior>0 ? ' ('+(delta>=0?'+':'')+Math.round(delta/anterior*100)+'%)' : '';
      deltaHtml = '<span class="cresc-delta '+cls+'">'+seta+' '+(delta>0?'+':'')+delta+pctTxt+'</span>';
    }
    var lbl = _MODO_CRESC==='dia' ? _fmtDiaLbl(k) : (_MODO_CRESC==='semana' ? _fmtSemanaLbl(k) : _fmtMesLbl(k));
    return '<div class="cresc-row"><div class="cresc-lbl">'+esc(lbl)+'</div><div class="cresc-track"><div class="cresc-fill" style="width:'+largura+'%;"></div></div><div class="cresc-val">'+atual+'</div>'+deltaHtml+'</div>';
  }).join('');

  var totalJanela = visiveis.reduce(function(s,k){ return s+buckets[k]; },0);

  return '<div class="card">'
    + '<div class="card-head"><div class="sh" style="border-bottom:none;margin-bottom:0;padding-bottom:0;flex:1;"><span class="sn">09</span><span class="st">Crescimento da Base</span><span class="ss">Novos cadastros · '+totalJanela+' no período exibido</span></div>'
      + '<div class="seg">'
        + '<button class="'+(_MODO_CRESC==='dia'?'on':'')+'" onclick="toggleModoCresc(\'dia\')">Diário</button>'
        + '<button class="'+(_MODO_CRESC==='semana'?'on':'')+'" onclick="toggleModoCresc(\'semana\')">Semanal</button>'
        + '<button class="'+(_MODO_CRESC==='mes'?'on':'')+'" onclick="toggleModoCresc(\'mes\')">Mensal</button>'
      + '</div></div>'
    + '<div style="margin-top:10px;">'+linhas+'</div>'
  + '</div>';
}

// ── Candidatos Contratados (dados espelhados pra conferência/exportação) ──
// Estado de ordenação da tabela — controlado pelos ícones clicáveis no cabeçalho.
var _SORT_CONTRATADOS = { campo: 'data_contratacao', dir: 'desc' };

// Extrai o valor de comparação de um candidato para um dado campo ordenável.
function _valorOrdenacaoContratados(c, campo) {
  switch (campo) {
    case 'data_contratacao': return c.data_contratacao || '';
    case 'mou': return (c.mou||'').toLowerCase() === 'assinado' ? '1' : '0';
    case 'situacao': return c.etapa === 'Trabalhando' ? '1' : '0';
    case 'nome': return (c.nome||'').toLowerCase();
    case 'telefone': return (c.telefone||'');
    case 'email': return (c.email||'').toLowerCase();
    case 'praca': return (pracaLabel(c.praca)||c.praca||'').toLowerCase();
    case 'perfil': return (c.perfil||'');
    case 'origem_lead': return (c.origem_lead||'').toLowerCase();
    default: return '';
  }
}

// Aplica o estado de ordenação atual (_SORT_CONTRATADOS) a uma lista de contratados.
function _ordenarContratados(lista) {
  var campo = _SORT_CONTRATADOS.campo;
  var mult = _SORT_CONTRATADOS.dir === 'asc' ? 1 : -1;
  return lista.slice().sort(function(a,b){
    var va = _valorOrdenacaoContratados(a, campo);
    var vb = _valorOrdenacaoContratados(b, campo);
    if (va < vb) return -1 * mult;
    if (va > vb) return 1 * mult;
    return 0;
  });
}

// Chamado ao clicar no ícone de ordenação de uma coluna — alterna asc/desc se já for a coluna ativa.
function ordenarContratadosPor(campo) {
  if (_SORT_CONTRATADOS.campo === campo) {
    _SORT_CONTRATADOS.dir = (_SORT_CONTRATADOS.dir === 'asc') ? 'desc' : 'asc';
  } else {
    _SORT_CONTRATADOS.campo = campo;
    // Datas e MOU/Situação (booleanos) começam decrescente; texto começa crescente.
    _SORT_CONTRATADOS.dir = (campo === 'data_contratacao' || campo === 'mou' || campo === 'situacao') ? 'desc' : 'asc';
  }
  atualizarContratados();
}

function renderContratados(C) {
  var contratados = _ordenarContratados(C.filter(function(c){ return c.etapa === 'Contratação' || c.etapa === 'Trabalhando'; }));

  if (!contratados.length) {
    return '<div class="card"><div class="sh"><span class="sn">11</span><span class="st">Candidatos Contratados</span></div><div style="padding:10px 0;color:var(--t4);font-size:12px;">Nenhum candidato aprovado/contratado no filtro atual.</div></div>';
  }

  return '<div class="card card-flow">'
    + '<div class="card-head">'
      + '<div class="sh" style="border-bottom:none;margin-bottom:0;padding-bottom:0;flex:1;"><span class="sn">11</span><span class="st">Candidatos Contratados</span><span class="ss" id="contratados-count">'+contratados.length+' candidato(s) — dados pra conferência e exportação</span></div>'
      + '<select id="sel-contratados-mes" class="sel-aud" onchange="atualizarContratados()" style="margin-right:6px;">'
        + '<option value="todos">Todos os meses</option>'
        + _opcoesMesesContratados(contratados)
      + '</select>'
      + '<select id="sel-contratados-data" class="sel-aud" onchange="atualizarContratados()">'
        + '<option value="todos">Todos</option>'
        + '<option value="com-data">✅ Com data de contratação</option>'
        + '<option value="sem-data">🔎 Sem data de contratação</option>'
      + '</select>'
    + '</div>'
    + '<div id="contratados-corpo" style="margin-top:10px;">'+_corpoContratados(contratados)+'</div>'
  + '</div>';
}

// Reage à troca do select sem reprocessar o relatório inteiro (mesmo padrão da Auditoria).
function atualizarContratados() {
  var sel = document.getElementById('sel-contratados-data');
  var selMes = document.getElementById('sel-contratados-mes');
  var corpo = document.getElementById('contratados-corpo');
  var contagem = document.getElementById('contratados-count');
  if (!sel || !corpo) return;
  var C = window._C_ATUAL || [];
  var todosContratados = _ordenarContratados(C.filter(function(c){ return c.etapa === 'Contratação' || c.etapa === 'Trabalhando'; }));

  var tipo = sel.value;
  var mes = selMes ? selMes.value : 'todos';
  var filtrados = todosContratados;
  if (tipo === 'com-data') filtrados = filtrados.filter(function(c){ return !!c.data_contratacao; });
  if (tipo === 'sem-data') filtrados = filtrados.filter(function(c){ return !c.data_contratacao; });
  if (mes !== 'todos') filtrados = filtrados.filter(function(c){ return (c.data_contratacao||'').slice(0,7) === mes; });

  var descFiltro = [];
  if (tipo !== 'todos') descFiltro.push(tipo === 'com-data' ? 'com data de contratação' : 'sem data de contratação');
  if (mes !== 'todos') {
    var partesMes = mes.split('-');
    descFiltro.push((_MESES_NOME[parseInt(partesMes[1],10)]||mes) + ' ' + partesMes[0]);
  }

  if (contagem) {
    contagem.textContent = filtrados.length + ' candidato(s)'
      + (descFiltro.length ? ' — filtro: ' + descFiltro.join(', ') : ' — dados pra conferência e exportação');
  }
  corpo.innerHTML = filtrados.length
    ? _corpoContratados(filtrados)
    : '<div style="padding:10px 0;color:var(--t4);font-size:12px;">Nenhum candidato encontrado com esse filtro. 🎉</div>';
}

// Monta um <th> clicável com ícone de ordenação (▲/▼ quando ativo, ⇅ neutro quando não).
function _thOrdenavel(label, campo) {
  var ativo = _SORT_CONTRATADOS.campo === campo;
  var icone = ativo ? (_SORT_CONTRATADOS.dir === 'asc' ? '▲' : '▼') : '⇅';
  var corIcone = ativo ? 'var(--ac,#1A3BAD)' : 'var(--t4)';
  return '<th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;color:var(--t3);white-space:nowrap;">'
    + '<span onclick="ordenarContratadosPor(\''+campo+'\')" style="cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;" title="Clique para ordenar">'
      + '<span>'+esc(label)+'</span>'
      + '<span style="font-size:10px;color:'+corIcone+';'+(ativo?'font-weight:700;':'')+'">'+icone+'</span>'
    + '</span>'
  + '</th>';
}

// Data curta (dd/mm/aa) usada só nos badges de MOU/Situação, pra não estourar a largura da coluna.
function _fmtDataCurta(s){ if(!s) return ''; var d = new Date(s+'T12:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

// Monta as opções do seletor de mês a partir das datas de contratação disponíveis (formato 'YYYY-MM').
var _MESES_NOME = {1:'Janeiro',2:'Fevereiro',3:'Março',4:'Abril',5:'Maio',6:'Junho',7:'Julho',8:'Agosto',9:'Setembro',10:'Outubro',11:'Novembro',12:'Dezembro'};
function _opcoesMesesContratados(contratados) {
  var chaves = {};
  contratados.forEach(function(c){
    if (!c.data_contratacao) return;
    var chave = c.data_contratacao.slice(0,7); // 'YYYY-MM'
    if (chave.length === 7) chaves[chave] = true;
  });
  var ordenadas = Object.keys(chaves).sort(function(a,b){ return b.localeCompare(a); }); // desc
  return ordenadas.map(function(chave){
    var partes = chave.split('-');
    var ano = partes[0], mes = parseInt(partes[1],10);
    var label = (_MESES_NOME[mes]||chave) + ' ' + ano;
    return '<option value="'+chave+'">'+label+'</option>';
  }).join('');
}

// Monta a tabela + os dois consolidadores a partir de uma lista já filtrada de contratados.
function _corpoContratados(contratados) {
  var linhas = contratados.map(function(c){
    var mouOk = (c.mou||'').toLowerCase() === 'assinado';
    var statusHtml = mouOk
      ? '<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:#DCFCE7;color:#166534;white-space:nowrap;">MOU Assinado · '+_fmtDataCurta(c.data_mou)+'</span>'
      : '<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:#FEF3C7;color:#92400E;white-space:nowrap;">MOU Pendente</span>';
    var trabalhando = c.etapa === 'Trabalhando';
    var situacaoHtml = trabalhando
      ? '<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:#DCFCE7;color:#166534;white-space:nowrap;">Trabalhando'+(c.data_inicio?' · '+_fmtDataCurta(c.data_inicio):'')+'</span>'
      : '<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EEF2FD;color:#1A3BAD;white-space:nowrap;">Aguardando início</span>';
    return '<tr style="border-bottom:1px solid var(--rule);">'
      + '<td style="padding:7px 4px;white-space:nowrap;">'+fmtDate(c.data_contratacao)+'</td>'
      + '<td style="padding:7px 4px;white-space:nowrap;">'+statusHtml+'</td>'
      + '<td style="padding:7px 4px;white-space:nowrap;">'+situacaoHtml+'</td>'
      + '<td style="padding:7px 4px;font-weight:600;white-space:nowrap;">'+esc(c.nome)+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);white-space:nowrap;">'+esc(c.telefone||'—')+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);white-space:nowrap;">'+esc(c.email||'—')+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);white-space:nowrap;" title="Valor bruto no banco: '+esc(c.praca||'—')+'">'+esc(pracaLabel(c.praca))+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);white-space:nowrap;">'+esc(c.perfil||'—')+'</td>'
      + '<td style="padding:7px 4px;color:var(--t3);white-space:nowrap;">'+esc(c.origem_lead||'—')+'</td>'
    + '</tr>';
  }).join('');

  var porOrigem = {};
  contratados.forEach(function(c){ var o=c.origem_lead||'Não informado'; porOrigem[o]=(porOrigem[o]||0)+1; });
  var listaOrigem = Object.keys(porOrigem).sort(function(a,b){ return porOrigem[b]-porOrigem[a]; });
  var maxOrigem = Math.max.apply(null, listaOrigem.map(function(o){ return porOrigem[o]; }).concat([1]));
  var totalOrigem = contratados.length;
  var linhasOrigem = listaOrigem.map(function(o){
    var v = porOrigem[o];
    var largura = Math.round(v/maxOrigem*100);
    var pct = Math.round(v/totalOrigem*100);
    return '<div class="praca-row"><div>'+esc(o)+'</div><div class="praca-track"><div class="praca-fill" style="width:'+largura+'%;background:var(--am);"></div></div><div style="font-weight:700;">'+v+' <span style="font-weight:400;color:var(--t4);font-size:10px;">('+pct+'%)</span></div></div>';
  }).join('');

  // Consolidador por praça (cidade) — cobre qualquer praça nova do Future automaticamente,
  // pois agrupa pelo valor bruto de c.praca em vez de uma lista fixa.
  var porPracaOrigem = {};
  var perfisPorPraca = {};   // { praça: { A: n, B: n, ..., 'Sem perfil': n } }
  contratados.forEach(function(c){
    var p=pracaLabel(c.praca)||c.praca||'Sem praça'; porPracaOrigem[p]=(porPracaOrigem[p]||0)+1;
    var pf=(c.perfil||'').trim().toUpperCase()||'Sem perfil';
    (perfisPorPraca[p]=perfisPorPraca[p]||{})[pf]=((perfisPorPraca[p]||{})[pf]||0)+1;
  });
  function chipsPerfil(p){
    var m=perfisPorPraca[p]||{};
    var totalPraca=porPracaOrigem[p]||1;
    var ks=Object.keys(m).sort(function(a,b){ if(a==='Sem perfil')return 1; if(b==='Sem perfil')return -1; return a<b?-1:a>b?1:0; });
    return '<div class="perf-sub">'+ks.map(function(k){ return '<span class="perf-chip'+(k==='Sem perfil'?' nd':'')+'"><b>'+m[k]+' '+(k==='Sem perfil'?'sem perfil':esc(k))+'</b> = '+Math.round(m[k]/totalPraca*100)+'%</span>'; }).join('')+'</div>';
  }
  var listaPracaOrigem = Object.keys(porPracaOrigem).sort(function(a,b){ return porPracaOrigem[b]-porPracaOrigem[a]; });
  var maxPracaOrigem = Math.max.apply(null, listaPracaOrigem.map(function(p){ return porPracaOrigem[p]; }).concat([1]));
  var linhasPracaOrigem = listaPracaOrigem.map(function(p){
    var v = porPracaOrigem[p];
    var largura = Math.round(v/maxPracaOrigem*100);
    var pct = Math.round(v/totalOrigem*100);
    return '<div class="praca-row"><div>'+esc(p)+'</div><div class="praca-track"><div class="praca-fill" style="width:'+largura+'%;background:var(--am);"></div></div><div style="font-weight:700;">'+v+' <span style="font-weight:400;color:var(--t4);font-size:10px;">('+pct+'%)</span></div></div>'+chipsPerfil(p);
  }).join('');

  // Consolidador por Perfil (A/B/C/D) — classificação preenchida no CRM (aba Proposta Comercial).
  var porPerfil = {};
  contratados.forEach(function(c){ var p=c.perfil||'Não informado'; porPerfil[p]=(porPerfil[p]||0)+1; });
  var listaPerfil = Object.keys(porPerfil).sort(function(a,b){ return porPerfil[b]-porPerfil[a]; });
  var maxPerfil = Math.max.apply(null, listaPerfil.map(function(p){ return porPerfil[p]; }).concat([1]));
  var linhasPerfil = listaPerfil.map(function(p){
    var v = porPerfil[p];
    var largura = Math.round(v/maxPerfil*100);
    var pct = Math.round(v/totalOrigem*100);
    return '<div class="praca-row"><div>'+esc(p)+'</div><div class="praca-track"><div class="praca-fill" style="width:'+largura+'%;background:var(--am);"></div></div><div style="font-weight:700;">'+v+' <span style="font-weight:400;color:var(--t4);font-size:10px;">('+pct+'%)</span></div></div>';
  }).join('');

  var colunas = [
    ['data_contratacao','Data Contratação'], ['mou','MOU'], ['situacao','Situação'],
    ['nome','Nome Completo'], ['telefone','Telefone'], ['email','E-mail'],
    ['praca','Praça'], ['perfil','Perfil'], ['origem_lead','Origem do Lead']
  ];
  var theadHtml = colunas.map(function(col){ return _thOrdenavel(col[1], col[0]); }).join('');

  return '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">'
    + '<thead><tr style="border-bottom:1px solid var(--rule);">'+theadHtml+'</tr></thead>'
    + '<tbody>'+linhas+'</tbody></table></div>'
    + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);">'
      + '<div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">Consolidador de Origem do Lead — Quantidade e Percentual</div>'
      + '<div>'+linhasOrigem+'</div>'
    + '</div>'
    + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);">'
      + '<div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">Consolidador por Praça — Quantidade, Percentual e Perfil</div>'
      + '<div>'+linhasPracaOrigem+'</div>'
    + '</div>'
    + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);">'
      + '<div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">Consolidador por Perfil — Quantidade e Percentual</div>'
      + '<div>'+linhasPerfil+'</div>'
    + '</div>';
}


// ════════ TURNOVER ════════
// Base = todo candidato que chegou a ser contratado (Contratação, Trabalhando ou Desligado).
// Turnover acumulado = Desligados ÷ Base. Tempo de casa = início (ou contratação) → desligamento.
var ETAPAS_BASE_TURNOVER = ['Contratação','Trabalhando','Desligado'];
// Datas efetivas: usa o campo do CRM; se estiver vazio, tenta o histórico de etapas (registrado a cada mudança de etapa).
function _datasHist(c) {
  if (c._hist) return c._hist;
  var h = []; try { h = JSON.parse(c.historico_etapas || '[]'); } catch(e) { h = []; }
  var primeira = function(etapas){ for (var i=0;i<h.length;i++){ if (etapas.indexOf(h[i].etapa)>=0 && h[i].entrada) return String(h[i].entrada).slice(0,10); } return null; };
  return (c._hist = { contratacao: primeira(['Contratação','Trabalhando']), inicio: primeira(['Trabalhando']), desligamento: primeira(['Desligado']) });
}
function _datasEfetivas(c) {
  var H = _datasHist(c);
  return {
    contratacao: c.data_contratacao || H.contratacao, contratacaoHist: !c.data_contratacao && !!H.contratacao,
    inicio:      c.data_inicio      || H.inicio,      inicioHist:      !c.data_inicio      && !!H.inicio,
    desligamento:c.data_desligamento|| H.desligamento,desligamentoHist:!c.data_desligamento&& !!H.desligamento
  };
}
function _diasEntre(a, b) {
  if (!a || !b) return null;
  var d = Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 864e5);
  return d >= 0 ? d : null;
}
function _tempoCasaDias(c) { var D = _datasEfetivas(c); return _diasEntre(D.inicio || D.contratacao, D.desligamento); }
function _fmtTempoCasa(d) {
  if (d === null || d === undefined) return '—';
  if (d < 60) return d + ' dia' + (d === 1 ? '' : 's');
  return (d / 30.4).toFixed(1).replace('.', ',') + ' meses';
}
function _linhaTurnover(rotulo, des, base) {
  var pct = base ? Math.round(des / base * 100) : 0;
  return '<div class="praca-row"><div>'+esc(rotulo)+'</div><div class="praca-track"><div class="praca-fill" style="width:'+Math.max(pct, des ? 2 : 0)+'%;background:#475569;"></div></div>'
    + '<div style="font-weight:700;">'+pct+'% <span style="font-weight:400;color:var(--t4);font-size:10px;">('+des+' de '+base+')</span></div></div>';
}
function _blocoTurnover(titulo, grupos) {
  // grupos: { rótulo: {des:n, base:n} } — ordenado por base (maior primeiro)
  var chaves = Object.keys(grupos).sort(function(a,b){ return grupos[b].base - grupos[a].base; });
  return '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);">'
    + '<div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">'+titulo+'</div>'
    + chaves.map(function(k){ return _linhaTurnover(k, grupos[k].des, grupos[k].base); }).join('') + '</div>';
}
function renderTurnover(C) {
  var base = C.filter(function(c){ return ETAPAS_BASE_TURNOVER.indexOf((c.etapa||'').trim()) >= 0; });
  var des  = base.filter(function(c){ return (c.etapa||'').trim() === 'Desligado'; });
  var cab  = function(sub){ return '<div class="sh"><span class="sn">13</span><span class="st">Turnover</span><span class="ss">'+sub+'</span></div>'; };
  if (!base.length) return '<div class="card">'+cab('')+'<div style="padding:10px 0;color:var(--t4);font-size:12px;">Ainda não há candidatos contratados no filtro atual.</div></div>';

  var turnPct = Math.round(des.length / base.length * 100);
  var dias = des.map(_tempoCasaDias).filter(function(d){ return d !== null; });
  var media = dias.length ? Math.round(dias.reduce(function(a,b){ return a+b; }, 0) / dias.length) : null;
  var ate90 = dias.filter(function(d){ return d <= 90; }).length;
  var pct90 = dias.length ? Math.round(ate90 / dias.length * 100) : 0;

  var kpis = '<div class="row cols-4" style="margin-bottom:6px;">'
    + kpi('c4', 'Turnover acumulado', turnPct + '%', des.length + ' desligados de ' + base.length + ' contratados')
    + kpi('c1', 'Desligados', des.length, base.length - des.length + ' seguem contratados')
    + kpi('c2', 'Tempo médio de casa', _fmtTempoCasa(media), dias.length + ' de ' + des.length + ' com datas completas')
    + kpi('c3', 'Saíram em até 90 dias', dias.length ? pct90 + '%' : '—', ate90 + ' de ' + dias.length + ' desligados')
  + '</div>';

  var porPraca = {}, porPerfil = {}, porOrigem = {};
  base.forEach(function(c){
    var isD = (c.etapa||'').trim() === 'Desligado';
    var p = pracaLabel(c.praca) || c.praca || 'Sem praça';
    var pf = (c.perfil||'').trim().toUpperCase(); pf = pf ? 'Perfil ' + pf : 'Sem perfil';
    var o = c.origem_lead || 'Não informado';
    [[porPraca,p],[porPerfil,pf],[porOrigem,o]].forEach(function(x){
      var g = x[0][x[1]] = x[0][x[1]] || {des:0, base:0}; g.base++; if (isD) g.des++;
    });
  });

  var faixas = {'Até 3 meses':0,'3 a 6 meses':0,'6 a 12 meses':0,'Mais de 12 meses':0};
  dias.forEach(function(d){ if (d<=90) faixas['Até 3 meses']++; else if (d<=180) faixas['3 a 6 meses']++; else if (d<=365) faixas['6 a 12 meses']++; else faixas['Mais de 12 meses']++; });
  var maxF = Math.max.apply(null, Object.keys(faixas).map(function(k){ return faixas[k]; }).concat([1]));
  var blocoFaixas = '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);">'
    + '<div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">Quando saem — tempo de casa dos desligados</div>'
    + Object.keys(faixas).map(function(k){
        var v = faixas[k], pc = dias.length ? Math.round(v / dias.length * 100) : 0;
        return '<div class="praca-row"><div>'+k+'</div><div class="praca-track"><div class="praca-fill" style="width:'+Math.round(v/maxF*100)+'%;background:#475569;"></div></div><div style="font-weight:700;">'+v+' <span style="font-weight:400;color:var(--t4);font-size:10px;">('+pc+'%)</span></div></div>';
      }).join('') + '</div>';

  var lista = des.slice().sort(function(a,b){ return (_datasEfetivas(b).desligamento||'').localeCompare(_datasEfetivas(a).desligamento||''); });
  var td = 'padding:7px 4px;white-space:nowrap;';
  var semDatas = 0;
  var cel = function(d, hist, ruim){ return d ? fmtDate(d) + (hist ? ' <span title="Data tirada do histórico de etapas (o campo no CRM está vazio)" style="font-size:9px;color:var(--t4);">(hist.)</span>' : '') : '<span style="color:#B45309;font-size:10px;font-weight:700;">'+(ruim||'sem data')+'</span>'; };
  var linhas = lista.map(function(c){
    var D = _datasEfetivas(c);
    if (!(D.inicio || D.contratacao) || !D.desligamento) semDatas++;
    return '<tr style="border-bottom:1px solid var(--rule);">'
      + '<td style="'+td+'font-weight:600;">'+esc(c.nome)+'</td>'
      + '<td style="'+td+'color:var(--t3);">'+esc(pracaLabel(c.praca))+'</td>'
      + '<td style="'+td+'color:var(--t3);">'+esc(c.perfil||'—')+'</td>'
      + '<td style="'+td+'color:var(--t3);">'+esc(c.origem_lead||'—')+'</td>'
      + '<td style="'+td+'">'+cel(D.contratacao, D.contratacaoHist)+'</td>'
      + '<td style="'+td+'">'+cel(D.inicio, D.inicioHist)+'</td>'
      + '<td style="'+td+'">'+cel(D.desligamento, D.desligamentoHist)+'</td>'
      + '<td style="'+td+'font-weight:700;">'+_fmtTempoCasa(_tempoCasaDias(c))+'</td></tr>';
  }).join('');
  var th = function(t){ return '<th style="text-align:left;padding:6px 4px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);">'+t+'</th>'; };
  var avisoDatas = semDatas
    ? '<div style="margin:10px 0 0;padding:9px 12px;background:#FEF3C7;border-radius:8px;font-size:11px;color:#92400E;line-height:1.5;">⚠ <b>'+semDatas+' desligado(s) sem data de contratação/início</b> — não entram no tempo de casa. Abra o candidato no CRM e preencha as datas (ficam visíveis também na etapa Desligado).</div>'
    : '';
  var tabela = des.length
    ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);"><div style="font-size:9px;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:8px;">Candidatos desligados — conferência</div>'
      + '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="border-bottom:1px solid var(--rule);">'
      + th('Nome')+th('Praça')+th('Perfil')+th('Origem do Lead')+th('Contratação')+th('Início')+th('Desligamento')+th('Tempo de casa')
      + '</tr></thead><tbody>'+linhas+'</tbody></table></div>'+avisoDatas+'</div>'
    : '<div style="padding:12px 0;color:var(--t4);font-size:12px;">Nenhum desligamento registrado no filtro atual. 🎉</div>';

  var nota = '<div class="nota" style="margin-top:14px;font-size:10px;color:var(--t3);background:var(--canvas,#F4F6FB);border-radius:8px;padding:9px 12px;line-height:1.6;">📐 <b>Como ler:</b> a base são todos os que chegaram a ser contratados (Contratação, Trabalhando e Desligado). '
    + '<b>Turnover</b> = desligados ÷ base, acumulado desde o início do Future. <b>Tempo de casa</b> = da data de início (ou da contratação, se não houver início) até a data de desligamento; desligados sem essas datas ficam fora das médias.</div>';

  return '<div class="card">' + cab(des.length + ' desligado(s) · ' + turnPct + '% da base contratada') + kpis
    + _blocoTurnover('Turnover por Praça — desligados ÷ contratados', porPraca)
    + _blocoTurnover('Turnover por Perfil', porPerfil)
    + _blocoTurnover('Turnover por Origem do Lead', porOrigem)
    + blocoFaixas + tabela + nota + '</div>';
}

function renderPracas(C) {
  var porPraca = {};
  C.forEach(function(c){ var p=c.praca||'Sem praça'; porPraca[p]=(porPraca[p]||0)+1; });
  var lista = Object.keys(porPraca).sort(function(a,b){ return porPraca[b]-porPraca[a]; });
  var max = Math.max.apply(null, lista.map(function(p){ return porPraca[p]; }).concat([1]));

  var linhas = lista.map(function(p){
    var v = porPraca[p];
    var largura = Math.round(v/max*100);
    return '<div class="praca-row"><div>'+esc(p==='Sem praça'?p:pracaLabel(p))+'</div><div class="praca-track"><div class="praca-fill" style="width:'+largura+'%;"></div></div><div style="font-weight:700;">'+v+'</div></div>';
  }).join('');

  return '<div class="card"><div class="sh"><span class="sn">12</span><span class="st">Distribuição por Praça</span></div>'+linhas+'</div>';
}

// ════════ EXPORT PDF ════════
// Como o relatório é montado inteiramente em HTML/CSS (sem <canvas>), a impressão
// nativa do navegador já é suficiente — o CSS de @media print cuida das quebras
// de página. Essa função existe pra manter o mesmo padrão dos outros relatórios.
function exportarPDF() {
  window.print();
}

// ════════ EXPORT CSV ════════
function exportarCSV() {
  var C = window._C_ATUAL || [];
  if (!C.length) { alert('Nada para exportar com os filtros atuais.'); return; }

  var hdr = ['Nome','Telefone','E-mail','Praça','Etapa','Hunter','Líder','Status Proposta','Status MOU','Pré-Work','Origem do Lead','Motivo Declínio','Data Entrada','Data Contratação','Data Início','Data Declínio'];
  var linhas = C.map(function(c){
    var temProposta = TELEFONES_COM_PROPOSTA[(c.telefone||'').replace(/\D/g,'')] ? 'Sim' : 'Não';
    var preWorkLbl = preWorkStatus(c) === 'validado' ? 'Aprovado pelo Líder' : (preWorkStatus(c) === 'em_pre_work' ? 'Em Pré-Work' : '');
    var statusMou = (c.mou||'').toLowerCase() === 'assinado' ? 'Assinado ('+fmtDate(c.data_mou)+')' : 'Pendente';
    return [
      c.nome||'', c.telefone||'', c.email||'', pracaLabel(c.praca)||'', (ETAPA_INFO[c.etapa]||{}).lbl || c.etapa || '',
      c.hunter||'', c.lider||'', temProposta, statusMou, preWorkLbl, c.origem_lead||'', c.motivo_declinio||'',
      fmtDate(c.data_entrada), fmtDate(c.data_contratacao), fmtDate(c.data_inicio), fmtDate(c.data_declinio)
    ].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';');
  });

  var csv = '\uFEFF' + hdr.join(';') + '\n' + linhas.join('\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var hoje = new Date();
  a.href = url;
  a.download = 'blue3_future_' + (MS_HUNTER.size ? hunterTexto().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '_' : '') + hoje.getFullYear() + String(hoje.getMonth()+1).padStart(2,'0') + String(hoje.getDate()).padStart(2,'0') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

carregar();
