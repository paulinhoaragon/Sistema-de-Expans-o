<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="pipeline.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A0F1E;--cobalt:#1A3BAD;--cobalt-br:#2952E3;--cobalt-gl:#4A70F5;
  --gold:#B8962E;--g:#16A34A;--am:#B45309;--red:#DC2626;
  --canvas:#F0F2FA;--surface:#fff;--rule:#E2E5F0;
  --t1:#0A0F1E;--t2:#3A4268;--t3:#7A82A8;--t4:#A8B0CC;
  --r8:8px;--r12:12px;--sh:0 1px 4px rgba(10,15,30,.07),0 4px 16px rgba(10,15,30,.05);
}
body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:13px;}

/* ── LAYOUT ── */
.dash{padding:20px 24px;max-width:1300px;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);border-top:3px solid var(--cobalt);position:relative;overflow:hidden;}
.kpi.green{border-top-color:var(--g);}
.kpi.gold{border-top-color:var(--gold);}
.kpi.red{border-top-color:var(--red);}
.kpi.purple{border-top-color:#7C3AED;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.kpi-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--t1);line-height:1;}
.kpi-sub{font-size:10px;color:var(--t4);margin-top:5px;}
.kpi-trend{font-size:10px;font-weight:700;margin-top:4px;}
.kpi-trend.up{color:var(--g);}
.kpi-trend.down{color:var(--red);}

/* ── SEÇÃO ── */
.sec-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--rule);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
@media(max-width:900px){.row2,.row3{grid-template-columns:1fr;}}

/* ── CARD ── */
.card{background:var(--surface);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh);}
.card-title{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:12px;}

/* ── FUNIL ── */
.funil{display:flex;gap:0;border-radius:8px;overflow:hidden;}
.f-stage{flex:1;padding:12px 8px;text-align:center;}
.f-val{font-size:20px;font-weight:700;color:#fff;line-height:1;}
.f-lbl{font-size:9px;color:rgba(255,255,255,.7);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.f-pct{font-size:9px;color:rgba(255,255,255,.5);margin-top:2px;}

/* ── HUNTERS TABLE ── */
.hunter-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);}
.hunter-row:last-child{border-bottom:none;}
.h-rank{font-size:11px;font-weight:700;color:var(--t4);width:18px;}
.h-name{font-size:12px;font-weight:600;color:var(--t1);flex:1;padding-left:8px;}
.h-count{font-size:11px;color:var(--t3);}
.h-val{font-size:12px;font-weight:700;color:var(--cobalt);}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--t4);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-t{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.empty-s{font-size:12px;}
.btn-upload{display:inline-block;margin-top:14px;background:var(--cobalt);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}

/* ── STATUS BADGES ── */
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;}
.b-neg{background:#FEF3C7;color:#92400E;}
.b-ok{background:#DCFCE7;color:#166534;}
.b-red{background:#FEE2E2;color:#991B1B;}

/* ── Alertas ── */
.alerta-bloco{border-radius:10px;margin-bottom:24px;overflow:hidden;border:1px solid var(--rule);}
.alerta-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.alerta-header.crit{background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FECACA;}
.alerta-header.warn{background:#FFFBEB;color:#92400E;border-bottom:1px solid #FDE68A;}
.alerta-header.ok{background:#F0FDF4;color:#166534;border-bottom:1px solid #BBF7D0;}
.alerta-body{background:#fff;}
.alerta-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--rule);transition:background .15s;cursor:pointer;}
.alerta-item:last-child{border-bottom:none;}
.alerta-item:hover{background:#F8FAFF;}
.alerta-item-left{display:flex;align-items:center;gap:10px;}
.alerta-emoji{font-size:16px;flex-shrink:0;}
.alerta-nome{font-size:12px;font-weight:600;color:var(--t1);}
.alerta-desc{font-size:10px;color:var(--t3);margin-top:1px;}
.alerta-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.alerta-badge.crit{background:#FEE2E2;color:#DC2626;}
.alerta-badge.warn{background:#FEF3C7;color:#B45309;}
.alerta-toggle{font-size:11px;color:inherit;opacity:.6;}
</style>
</head>
<body>

<div class="dash" id="dash-root">
  <!-- Carregando -->
  <div class="empty" id="dash-loading">
    <div class="empty-icon">⏳</div>
    <div class="empty-t">Carregando dados...</div>
  </div>
</div>

<script>
var SUPA_URL = 'https://cjimsplgxrwkqgzegnkq.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqaW1zcGxneHJ3a3FnemVnbmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTg5MTEsImV4cCI6MjA5MTY3NDkxMX0.V5euouwf-Q4KaskXGB4eLg0FPV7pH96hTrQikcV7K6A';

function supa(path) {
  return fetch(SUPA_URL+'/rest/v1/'+path, {
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  }).then(function(r){ return r.json(); });
}

function fmt(n) {
  if (!n || n===0) return '—';
  var a = Math.abs(n);
  if (a >= 1e9)  return 'R$'+(n/1e9).toFixed(1).replace('.',',')+'B';
  if (a >= 1e6)  return 'R$'+(n/1e6).toFixed(1).replace('.',',')+'M';
  if (a >= 1e3)  return 'R$'+Math.round(n/1e3)+'K';
  return 'R$'+n.toLocaleString('pt-BR');
}
function pct(a,b){ return b>0?Math.round(a/b*100)+'%':'—'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Renderizar dashboard ──
function renderDash(G, H, crm, propostas, _ma) {
  var root = document.getElementById('dash-root');
  var C = window.Blue3Data.candidatos || [];

  var isAss = function(r){ return ['assessor','assessores'].indexOf((r.area||'assessores').toLowerCase()) !== -1; };
  var AT    = C.filter(function(r){ return isAss(r); }).length;
  var mouOk = C.filter(function(r){ return isAss(r) && (r.mou||'').toLowerCase()==='assinado'; }).length;
  var mouPend = AT - mouOk;
  var trab  = C.filter(function(r){ return isAss(r) && (r.st||'').toLowerCase()==='trabalhando'; }).length;
  var seniors = C.filter(function(r){ return (r.sen||'').toLowerCase()==='sênior'; }).length;
  var plenos  = C.filter(function(r){ return (r.sen||'').toLowerCase()==='pleno'; }).length;
  var juniors = C.filter(function(r){ var s=(r.sen||'').toLowerCase(); return s==='júnior'||s==='junior'; }).length;
  var capTotal = G.aucTotal || 0;
  var custoMM  = capTotal > 0 ? Math.round(G.compTotal / capTotal) : 0;

  var crmTotal = crm ? crm.length : 0;
  var crmEtapas = {};
  (crm||[]).forEach(function(r){ crmEtapas[r.etapa] = (crmEtapas[r.etapa]||0)+1; });
  var propTotal = propostas ? propostas.length : 0;
  var propStatusMap = {};
  (propostas||[]).forEach(function(r){ propStatusMap[r.status]=(propStatusMap[r.status]||0)+1; });

  var hoje = new Date(); var em30 = new Date(); em30.setDate(hoje.getDate()+30);
  var proximos = C.filter(function(r){
    if (!r.inicio) return false;
    if ((r.st||'').toLowerCase() === 'trabalhando') return false;
    var d = new Date(r.inicio); return d>=hoje && d<=em30;
  }).sort(function(a,b){ return new Date(a.inicio)-new Date(b.inicio); });

  var META=40, MESES=6;
  var DEC = Math.min(MESES, Math.max(1, new Date().getMonth()+1));
  var proj = Math.round(AT/Math.max(1,DEC)*MESES);
  var esp  = Math.round(DEC/MESES*META);
  var saldo= AT - esp;
  var pctPace = Math.min(100, Math.round(AT/META*100));
  var paceOk  = proj >= META;
  var mLabels=['Jan','Fev','Mar','Abr','Mai','Jun'];

  function mbox(val,lbl,bg,bdr,vc,lc){
    return '<div style="background:'+bg+';border:1px solid '+bdr+';border-radius:6px;padding:8px 10px;text-align:center;">'
      +'<div style="font-size:18px;font-weight:700;color:'+vc+';">'+val+'</div>'
      +'<div style="font-size:9px;text-transform:uppercase;color:'+lc+';letter-spacing:.06em;margin-top:2px;">'+lbl+'</div></div>';
  }

  // ══════════════════════════════════════════════
  // ALERTAS
  // ══════════════════════════════════════════════
  var hoje2 = new Date(); hoje2.setHours(0,0,0,0);

  function diasDesde(campo) {
    if (!campo) return null;
    var fmt = campo.indexOf('/') > -1;
    var d;
    if (fmt) {
      var p = campo.split('/');
      d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
    } else {
      d = new Date(campo);
    }
    if (isNaN(d)) return null;
    return Math.floor((hoje2 - d) / 86400000);
  }

  var alertasCrit = [];
  var alertasWarn = [];

  C.filter(isAss).forEach(function(r) {
    var nome = r.n || '—';
    var praca = r.p || '—';
    var st = (r.st||'').toLowerCase();
    var mou = (r.mou||'').toLowerCase();
    var isContrat = st === 'contratado(a)' || st === 'contratado';
    var isTrab = st === 'trabalhando';

    // ── 🔴 MOU vencido (>90 dias sem ativar) ──
    if (isContrat && mou === 'assinado' && r.data_mou) {
      var dias = diasDesde(r.data_mou);
      if (dias !== null && dias > 90) {
        alertasCrit.push({
          emoji: '🔴',
          nome: nome,
          desc: praca + ' · MOU assinado há ' + dias + ' dias sem ativação',
          badge: dias + 'd sem ativar',
          tipo: 'crit',
          nav: 'crm.html'
        });
      } else if (dias !== null && dias > 60) {
        alertasWarn.push({
          emoji: '🟡',
          nome: nome,
          desc: praca + ' · MOU assinado há ' + dias + ' dias — atenção',
          badge: dias + 'd de MOU',
          tipo: 'warn',
          nav: 'crm.html'
        });
      }
    }

    // ── 🔴 Sem MOU há mais de 30 dias ──
    if (isContrat && mou !== 'assinado' && r.dt) {
      var diasSemMou = diasDesde(r.dt);
      if (diasSemMou !== null && diasSemMou > 30) {
        alertasCrit.push({
          emoji: '📋',
          nome: nome,
          desc: praca + ' · Contratado há ' + diasSemMou + ' dias sem MOU assinado',
          badge: 'Sem MOU',
          tipo: 'crit',
          nav: 'crm.html'
        });
      }
    }

    // ── 🔴 Candidato parado >45 dias em Contratação ──
    if (isContrat && r.dt) {
      var diasParado = diasDesde(r.dt);
      if (diasParado !== null && diasParado > 45 && mou !== 'assinado') {
        // Já capturado acima — evitar duplicata
      } else if (diasParado !== null && diasParado > 45 && mou === 'assinado') {
        // Coberto pelo MOU vencido acima
      }
    }

    // ── 🟡 Ativação nos próximos 7 dias ──
    if (isContrat && r.inicio) {
      var dInicio = r.inicio.indexOf('/') > -1
        ? (function(p){ return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])); })(r.inicio.split('/'))
        : new Date(r.inicio);
      if (!isNaN(dInicio)) {
        var diff = Math.ceil((dInicio - hoje2) / 86400000);
        if (diff >= 0 && diff <= 7) {
          alertasWarn.push({
            emoji: '🚀',
            nome: nome,
            desc: praca + ' · Previsão de início em ' + diff + (diff===1?' dia':' dias'),
            badge: 'Início em ' + diff + 'd',
            tipo: 'warn',
            nav: 'crm.html'
          });
        }
      }
    }
  });

  // ── Vagas críticas sem hunter ──
  (window.Blue3Data && window.Blue3Data._vagas || []).forEach(function(v) {
    if (v.status !== 'aberta' || v.prioridade !== 'Alto') return;
    var diasAberta = diasDesde(v.created_at);
    if (diasAberta !== null && diasAberta > 15) {
      alertasCrit.push({
        emoji: '💼',
        nome: v.cargo || 'Vaga sem título',
        desc: (v.unidade||'—') + ' · Aberta há ' + diasAberta + ' dias sem hunter',
        badge: diasAberta + 'd aberta',
        tipo: 'crit',
        nav: 'vagas.html'
      });
    }
  });

  function renderAlertas(lista, tipo) {
    if (!lista.length) return '';
    var label = tipo === 'crit'
      ? '🔴 ' + lista.length + ' alerta' + (lista.length>1?'s':'') + ' crítico' + (lista.length>1?'s':'')
      : '🟡 ' + lista.length + ' ponto' + (lista.length>1?'s':'') + ' de atenção';
    var id = 'alerta-body-' + tipo;
    var html = '<div class="alerta-bloco">'
      + '<div class="alerta-header ' + tipo + '" onclick="(function(el){'
        + 'var b=document.getElementById(\'' + id + '\');'
        + 'var t=el.querySelector(\'.alerta-toggle\');'
        + 'if(b.style.display===\'none\'){b.style.display=\'\';t.textContent=\'▲\';}else{b.style.display=\'none\';t.textContent=\'▼\';}'
        + '})(this)">'
        + '<span>' + label + '</span>'
        + '<span class="alerta-toggle">▲</span>'
      + '</div>'
      + '<div class="alerta-body" id="' + id + '">'
      + lista.map(function(a) {
          return '<div class="alerta-item" onclick="window.parent.navTo && window.parent.navTo(\'' + a.nav + '\',\'\') ">'
            + '<div class="alerta-item-left">'
              + '<div class="alerta-emoji">' + a.emoji + '</div>'
              + '<div><div class="alerta-nome">' + a.nome + '</div>'
              + '<div class="alerta-desc">' + a.desc + '</div></div>'
            + '</div>'
            + '<span class="alerta-badge ' + a.tipo + '">' + a.badge + '</span>'
          + '</div>';
        }).join('')
      + '</div></div>';
    return html;
  }

  var alertasHtml = '';
  if (alertasCrit.length || alertasWarn.length) {
    alertasHtml = '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:10px;">Alertas Operacionais</div>'
      + renderAlertas(alertasCrit, 'crit')
      + renderAlertas(alertasWarn, 'warn');
  }

  root.innerHTML = [alertasHtml,

    // ── BLOCO 1: Expansão ──
    '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:10px;">Expansão</div>',
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;">',

      '<div class="kpi green">',
        '<div class="kpi-label">Assessores</div>',
        '<div class="kpi-value">'+AT+'</div>',
        '<div class="kpi-sub">'+trab+' trabalhando · '+(AT-trab)+' a iniciar</div>',
        '<div class="kpi-sub">'+(G.brutas||AT)+' brutas · '+(G.desist||0)+' declinaram</div>',
        '<div class="kpi-trend up">'+pct(AT,(G.brutas||AT)+(G.desist||0))+' taxa aproveitamento</div>',
      '</div>',

      '<div class="kpi" style="border-top-color:var(--cobalt)">',
        '<div class="kpi-label">AuC Mapeado</div>',
        '<div class="kpi-value" style="font-size:22px">R$'+(G.aucContrat>0?(G.aucContrat>=1000?(G.aucContrat/1000).toFixed(2).replace('.',',')+'B':G.aucContrat+'MM'):(G.aucB||'0')+'B')+'</div>',
        '<div class="kpi-sub"><span style="color:var(--g);font-weight:600;">R$'+(G.aucTrab>0?(G.aucTrab>=1000?(G.aucTrab/1000).toFixed(2).replace('.',',')+'B':G.aucTrab+'MM'):'—')+'</span> trabalhando</div>',
        '<div class="kpi-sub">'+C.filter(function(r){return r.cap>0;}).length+' candidatos com carteira</div>',
        '<div class="kpi-trend up">'+seniors+' Sênior · '+plenos+' Pleno · '+juniors+' Júnior</div>',
      '</div>',

      '<div class="kpi gold">',
        '<div class="kpi-label">Custo Total</div>',
        '<div class="kpi-value" style="font-size:22px">'+fmt(G.compTotal)+'</div>',
        '<div class="kpi-sub">'+fmt(G.blue3Liq)+' líquido Blue3</div>',
        '<div class="kpi-sub">'+fmt(G.xpTotal)+' coberto XP</div>',
      '</div>',

      '<div class="kpi" style="border-top-color:#7C3AED">',
        '<div class="kpi-label">Custo por MM Captado</div>',
        '<div class="kpi-value" style="font-size:22px">'+(custoMM>0?'R$'+custoMM.toLocaleString('pt-BR'):'—')+'</div>',
        '<div class="kpi-sub">por R$1M de captação acordada</div>',
        '<div class="kpi-sub">'+capTotal+' MM meta total</div>',
      '</div>',

    '</div>',

    // ── BLOCO 2: Pipeline Operacional ──
    '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:10px;">Pipeline Operacional</div>',
    '<div class="row2" style="margin-bottom:24px;">',

      '<div class="card">',
        '<div class="card-title">Funil de Conversão — Assessores</div>',
        '<div class="funil" style="margin-bottom:14px;">',
          funilStage('Contratados', AT, AT, '#1A3BAD'),
          funilStage('MOU', mouOk, AT, '#2952E3'),
          funilStage('Trabalhando', trab, AT, '#16A34A'),
        '</div>',
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">',
          mbox(mouPend,'MOU Pendente','#FFF7ED','#FED7AA','#C2410C','#92400E'),
          mbox(pct(mouOk,AT),'Taxa MOU','#EFF6FF','#BFDBFE','#1A3BAD','#1E3A5F'),
          mbox(pct(trab,AT),'Taxa Ativação','#F0FDF4','#BBF7D0','#16A34A','#166534'),
        '</div>',
      '</div>',

      '<div class="card">',
        '<div class="card-title">Performance Hunters</div>',
        renderHunters(H),
      '</div>',

    '</div>',

    // ── BLOCO 3: Controle e Metas ──
    '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:10px;">Controle e Metas</div>',
    '<div class="row3" style="margin-bottom:24px;">',

      '<div class="card">',
        '<div class="card-title">Pace · Meta 40 no Semestre</div>',
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">',
          '<span style="font-size:28px;font-weight:700;font-family:Playfair Display,serif;color:var(--t1);">'+AT+'</span>',
          '<span style="font-size:12px;color:var(--t3);">meta <strong>'+META+'</strong></span>',
        '</div>',
        '<div style="background:#E8EDF8;border-radius:10px;height:8px;margin-bottom:10px;position:relative;overflow:hidden;">',
          '<div style="position:absolute;left:50%;top:0;width:2px;height:8px;background:#94A3B8;z-index:1;"></div>',
          '<div style="width:'+pctPace+'%;height:8px;border-radius:10px;background:linear-gradient(90deg,#1A3BAD,'+(paceOk?'#16A34A':'#DC2626')+');"></div>',
        '</div>',
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">',
          '<div style="background:#F4F6FB;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:16px;font-weight:700;color:var(--cobalt);">'+pctPace+'%</div><div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">Do Pace</div></div>',
          '<div style="background:#F4F6FB;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:16px;font-weight:700;color:'+(paceOk?'var(--g)':'var(--red)')+';">'+proj+'</div><div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">Projeção Jun</div></div>',
        '</div>',
        '<div style="padding:8px 12px;border-radius:6px;background:'+(paceOk?'#F0FDF4':'#FFF7ED')+';border:1px solid '+(paceOk?'#BBF7D0':'#FED7AA')+';font-size:11px;color:'+(paceOk?'#166534':'#92400E')+';">',
          (paceOk?'✓ No pace. ':'⚠ ')+'Saldo de '+(saldo>=0?'+':'')+saldo+' vs esperado ('+esp+' até '+mLabels[DEC-1]+').',
        '</div>',
      '</div>',

      '<div class="card">',
        '<div class="card-title">CRM · Distribuição por Etapa</div>',
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">',
          '<span style="font-size:24px;font-weight:700;font-family:Playfair Display,serif;">'+crmTotal+'</span>',
          '<span style="font-size:10px;color:var(--t3);">candidatos no funil</span>',
        '</div>',
        renderCRMEtapas(crmEtapas),
      '</div>',

      '<div class="card">',
        '<div class="card-title">Propostas Comerciais</div>',
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">',
          '<span style="font-size:24px;font-weight:700;font-family:Playfair Display,serif;">'+propTotal+'</span>',
          '<span style="font-size:10px;color:var(--t3);">versões registradas</span>',
        '</div>',
        renderPropStatus(propStatusMap, propTotal),
      '</div>',

    '</div>',

    // ── BLOCO 4: Próximos Inícios ──
    proximos.length > 0 ? [
      '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:10px;">Próximos Inícios — 30 dias</div>',
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:24px;">',
        proximos.map(function(r){
          var d = new Date(r.inicio);
          var ds = d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0');
          return '<div style="background:#fff;border:1px solid #BBF7D0;border-left:3px solid #16A34A;border-radius:8px;padding:12px 14px;">'
            +'<div style="font-size:12px;font-weight:700;color:var(--t1);">'+r.n.split(' ').slice(0,2).join(' ')+'</div>'
            +'<div style="font-size:10px;color:var(--t3);margin-top:2px;">'+r.p+'</div>'
            +'<div style="font-size:11px;font-weight:600;color:#16A34A;margin-top:6px;">📅 Início '+ds+'</div>'
            +'</div>';
        }).join(''),
      '</div>',
    ].join('') : '',

  ].join('');
}

function kpiCard(label, cls, value, sub1, sub2) {
  return '<div class="kpi '+(cls||'')+'"><div class="kpi-label">'+esc(label)+'</div>'
    +'<div class="kpi-value">'+esc(String(value))+'</div>'
    +(sub1?'<div class="kpi-sub">'+esc(sub1)+'</div>':'')
    +(sub2?'<div class="kpi-sub">'+esc(sub2)+'</div>':'')
    +'</div>';
}

function funilStage(label, val, total, color) {
  var p = total > 0 ? Math.round(val/total*100) : 0;
  return '<div class="f-stage" style="background:'+color+';">'
    +'<div class="f-val">'+val+'</div>'
    +'<div class="f-lbl">'+label+'</div>'
    +'<div class="f-pct">'+p+'%</div>'
    +'</div>';
}

function renderHunters(H) {
  if (!H || !H.length) return '<div style="font-size:12px;color:var(--t4);padding:16px 0;text-align:center;">Sem dados de hunters.<br>Faça upload do CSV.</div>';
  return H.slice(0,5).map(function(h, i){
    return '<div class="hunter-row">'
      +'<span class="h-rank">'+(i+1)+'</span>'
      +'<span class="h-name">'+esc(h.nome||'')+'</span>'
      +'<span class="h-count">'+h.total+' contrat.</span>'
      +'<span class="h-val">'+fmt((h.auc||0)*1e6)+'</span>'
      +'</div>';
  }).join('');
}

function renderCRMEtapas(etapas) {
  var ordem = ['Prospecção','Qualificação','Negociação','Contratação','Trabalhando','Declinou','Contato Futuro'];
  var total = Object.values(etapas).reduce(function(s,v){ return s+v; },0);
  if (!total) return '<div style="text-align:center;padding:20px;font-size:11px;color:var(--t4);">Nenhum candidato no CRM ainda.</div>';
  var cores = {'Prospecção':'#64748B','Qualificação':'#7C3AED','Negociação':'#B45309',
    'Contratação':'#C2410C','Trabalhando':'#16A34A','Declinou':'#DC2626','Contato Futuro':'#94A3B8'};
  return ordem.map(function(etapa){
    var n = etapas[etapa] || 0;
    if (!n) return '';
    var p = Math.round(n/total*100);
    var cor = cores[etapa] || '#1A3BAD';
    return '<div style="margin-bottom:8px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">'
      +'<span style="color:var(--t2);font-weight:600;">'+esc(etapa)+'</span>'
      +'<span style="color:var(--t3);">'+n+' ('+p+'%)</span>'
      +'</div>'
      +'<div style="background:#E8EDF8;border-radius:10px;height:5px;">'
      +'<div style="width:'+p+'%;height:5px;border-radius:10px;background:'+cor+';"></div>'
      +'</div></div>';
  }).join('');
}

function renderPropStatus(status, total) {
  if (!total) return '<div style="text-align:center;padding:20px;font-size:11px;color:var(--t4);">Nenhuma proposta salva ainda.</div>';
  var ordem = ['Em negociação','Aceita','Declinada','Expirada'];
  var cores = {'Em negociação':'#B45309','Aceita':'#16A34A','Declinada':'#DC2626','Expirada':'#94A3B8'};
  return ordem.map(function(s){
    var n = status[s] || 0;
    if (!n) return '';
    var p = Math.round(n/total*100);
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule);">'
      +'<span style="font-size:11px;font-weight:600;color:var(--t1);">'+esc(s)+'</span>'
      +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<div style="width:60px;background:#E8EDF8;border-radius:8px;height:4px;">'
      +'<div style="width:'+p+'%;height:4px;border-radius:8px;background:'+(cores[s]||'#1A3BAD')+';"></div></div>'
      +'<span style="font-size:11px;font-weight:700;color:var(--t2);min-width:24px;text-align:right;">'+n+'</span>'
      +'</div></div>';
  }).join('');
}

function renderPace(AT) {
  var META = 40, MESES = 6;
  var DEC = new Date().getMonth() + 1;
  if (DEC < 1) DEC = 1; if (DEC > MESES) DEC = MESES;
  var proj = Math.round(AT / Math.max(1,DEC) * MESES);
  var pct_pace = Math.min(100, Math.round(AT/META*100));
  var ok = proj >= META;
  var esp = Math.round(DEC/MESES*META);
  var saldo = AT - esp;
  var mLabels = ['Jan','Fev','Mar','Abr','Mai','Jun'];
  var mesLabel = mLabels[DEC-1] || 'Mai';
  return '<div>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">'
    +'<span style="color:var(--t2);">Contratados: <strong>'+AT+'</strong></span>'
    +'<span style="color:var(--t3);">Meta: <strong>'+META+'</strong></span>'
    +'</div>'
    +'<div style="background:#E8EDF8;border-radius:10px;height:8px;margin-bottom:8px;position:relative;">'
    +'<div style="width:50%;height:8px;border-radius:10px 0 0 10px;border-right:2px solid #94A3B8;position:absolute;top:0;"></div>'
    +'<div style="width:'+pct_pace+'%;height:8px;border-radius:10px;background:linear-gradient(90deg,#1A3BAD,'+(ok?'#16A34A':'#DC2626')+');"></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">'
    +'<div style="background:#F4F6FB;border-radius:6px;padding:8px;text-align:center;">'
    +'<div style="font-size:16px;font-weight:700;color:var(--cobalt);">'+pct_pace+'%</div>'
    +'<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;">Do pace</div>'
    +'</div>'
    +'<div style="background:#F4F6FB;border-radius:6px;padding:8px;text-align:center;">'
    +'<div style="font-size:16px;font-weight:700;color:'+(ok?'#16A34A':'#DC2626')+';">'+proj+'</div>'
    +'<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;">Projeção Jun</div>'
    +'</div>'
    +'</div>'
    +'<div style="margin-top:8px;padding:8px 10px;background:'+(ok?'#F0FDF4':'#FFF7ED')+';border-left:3px solid '+(ok?'#16A34A':'#F59E0B')+';border-radius:0 6px 6px 0;font-size:11px;color:'+(ok?'#15803D':'#92400E')+';">'
    +(ok?'✓ No pace. Saldo de '+(saldo>=0?'+':'')+saldo+' vs esperado.':'⚠ Saldo de '+(saldo>=0?'+':'')+saldo+' vs esperado ('+(esp)+' esperados até agora).')
    +'</div>'
    +'</div>';
}

function showEmpty() {
  document.getElementById('dash-root').innerHTML = '<div class="empty">'
    +'<div class="empty-icon">📊</div>'
    +'<div class="empty-t">Sem dados carregados</div>'
    +'<div class="empty-s">Faça upload do CSV para visualizar o dashboard.</div>'
    +'</div>';
}

// ── Init ──
(function(){
  try { localStorage.removeItem('B3D'); localStorage.removeItem('B3D_RAW'); } catch(e){}
  if (typeof Blue3_init === 'function') {
    Blue3_init(function(ok){
      if (ok && window.Blue3Data) {
        var G = window.Blue3Data.resumoGeral || {};
        var H = window.Blue3Data.hunters || [];
        Promise.all([
          supa('crm_candidatos?select=etapa&limit=500').catch(function(){ return []; }),
          supa('propostas?select=status&limit=500').catch(function(){ return []; }),
          supa('ma_pipeline?select=id,nome,praca,auc_b,status&limit=200').catch(function(){ return []; }),
          supa('vagas?select=id,cargo,unidade,status,prioridade,created_at&status=eq.aberta&limit=100').catch(function(){ return []; })
        ]).then(function(results){
          if (window.Blue3Data) window.Blue3Data._vagas = results[3] || [];
          renderDash(G, H, results[0], results[1], results[2]);
        });
      } else {
        showEmpty();
      }
    });
  } else {
    showEmpty();
  }
})();

window.b3OnCSVLoaded = function(){ /* ignorado — usando Supabase */ };
</script>
</body>
