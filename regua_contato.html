<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus · Régua de Contato</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A0F1E;--cobalt:#1A3BAD;--cobalt-br:#2952E3;--cobalt-gl:#4A70F5;
  --gold:#B8962E;--g:#16A34A;--am:#B45309;--red:#DC2626;
  --canvas:#F0F2FA;--surface:#fff;--rule:#E2E5F0;
  --t1:#0A0F1E;--t2:#3A4268;--t3:#7A82A8;--t4:#A8B0CC;
  --r8:8px;--r12:12px;--sh:0 1px 4px rgba(10,15,30,.07),0 4px 16px rgba(10,15,30,.06);
}
body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:13px;min-height:100vh}

/* ── COVER ── */
.cover{background:var(--ink);min-height:104px;position:relative;overflow:hidden;padding:26px 32px 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.cg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.cgl{position:absolute;top:-80px;right:-40px;width:360px;height:360px;background:radial-gradient(ellipse,rgba(41,82,227,.18) 0%,transparent 65%);pointer-events:none}
.cv-t{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#fff;letter-spacing:-.02em;position:relative}
.cv-s{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.14em;margin-top:3px;position:relative}

/* ── KPIs ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px 4px}
.kpi{background:var(--surface);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--rule);cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi.red{border-top-color:var(--red)}
.kpi.amber{border-top-color:var(--am)}
.kpi.blue{border-top-color:var(--cobalt)}
.kpi.green{border-top-color:var(--g)}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.kpi-value{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--t1);line-height:1}
.kpi-sub{font-size:9px;color:var(--t4);margin-top:4px}

/* ── FILTROS ── */
.filters{background:var(--surface);border-bottom:1px solid var(--rule);padding:10px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50;margin-top:12px}
.f-sel{padding:6px 10px;border:1px solid var(--rule);border-radius:6px;font-size:11px;font-family:'DM Sans',sans-serif;color:var(--t1);background:#fafbfd;outline:none;cursor:pointer}
.f-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.f-count{font-size:11px;color:var(--t4);margin-left:auto}
.f-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer}

/* ── BANNER (colunas ausentes) ── */
.banner-warn{margin:14px 24px 0;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:8px;padding:10px 14px;font-size:11px;line-height:1.5}
.banner-warn code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:10px}

/* ── CONTEÚDO ── */
.content{padding:16px 24px 40px}
.rc-section{background:var(--surface);border-radius:var(--r12);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.rc-sec-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.rc-sec-left{display:flex;align-items:center;gap:10px}
.rc-sec-num{width:24px;height:24px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rc-sec-title{font-size:13px;font-weight:700;color:var(--t1)}
.rc-sec-desc{font-size:10px;color:var(--t3);margin-top:2px;font-weight:400}
.rc-sec-count{font-size:10px;font-weight:700;color:var(--t3);background:var(--canvas);padding:3px 10px;border-radius:20px}
.rc-sec-toggle{font-size:11px;color:var(--t4);margin-left:10px}

.rc-table{width:100%;border-collapse:collapse}
.rc-table th{text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);padding:8px 14px;border-bottom:1px solid var(--rule);background:#FAFBFF}
.rc-table td{padding:9px 14px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--t2);vertical-align:middle}
.rc-table tr:last-child td{border-bottom:none}
.rc-table tr:hover td{background:#F8FAFF}
.rc-nome{font-weight:700;color:var(--t1)}
.rc-sub{font-size:10px;color:var(--t4)}

.rc-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.rc-badge.atrasado{background:#FEE2E2;color:#991B1B}
.rc-badge.atencao{background:#FEF3C7;color:#92400E}
.rc-badge.noprazo{background:#EEF2FD;color:var(--cobalt)}
.rc-badge.concluido{background:#DCFCE7;color:#166534}
.rc-badge.concluido.atraso{background:#FEF3C7;color:#92400E}

.btn-ok{background:var(--cobalt);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-ok:hover{background:var(--cobalt-br)}
.btn-outline{background:#fff;color:var(--cobalt);border:1px solid var(--cobalt);border-radius:6px;padding:6px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;margin-left:6px}
.btn-outline:hover{background:#EEF2FD}
.btn-undo{background:none;border:none;color:var(--t4);font-size:10px;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif;margin-left:8px}
.btn-undo:hover{color:var(--red)}

.rc-empty{padding:24px;text-align:center;color:var(--t4);font-size:12px}

.empty{text-align:center;padding:60px 20px;color:var(--t4)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:6px}
.empty-s{font-size:12px}
</style>
</head>
<body>

<div class="cover">
  <div class="cg"></div><div class="cgl"></div>
  <div>
    <div class="cv-t">Régua de Contato</div>
    <div class="cv-s">Marcos de acompanhamento pós-contratação</div>
  </div>
</div>

<div id="banner-root"></div>
<div class="kpi-strip" id="kpi-root"></div>

<div class="filters">
  <span class="f-lbl">Hunter</span>
  <select class="f-sel" id="f-hunter" onchange="aplicarFiltros()"><option value="">Todos</option></select>
  <span class="f-lbl">Líder</span>
  <select class="f-sel" id="f-lider" onchange="aplicarFiltros()"><option value="">Todos</option></select>
  <span class="f-lbl">Regional</span>
  <select class="f-sel" id="f-regional" onchange="aplicarFiltros()">
    <option value="">Todas</option>
    <option value="Tamires">Tamires</option>
    <option value="Yokoy">Yokoy</option>
    <option value="Bruno">Bruno</option>
    <option value="MariaLaura">Maria Laura</option>
    <option value="_sem">Sem regional mapeada</option>
  </select>
  <span class="f-lbl">Praça</span>
  <select class="f-sel" id="f-praca" onchange="aplicarFiltros()"><option value="">Todas</option></select>
  <span class="f-lbl">Status</span>
  <select class="f-sel" id="f-status" onchange="aplicarFiltros()">
    <option value="">Todos</option>
    <option value="atrasado">Atrasado</option>
    <option value="atencao">Atenção</option>
    <option value="noprazo">No prazo</option>
    <option value="concluido">Concluído</option>
  </select>
  <label class="f-check"><input type="checkbox" id="f-ocultar-concluidos" onchange="aplicarFiltros()"> Ocultar concluídos</label>
  <button class="btn-outline" onclick="copiarResumo()" style="margin-left:auto">📋 Copiar resumo</button>
  <span class="f-count" id="f-count">—</span>
</div>

<div class="content" id="content-root">
  <div class="empty"><div class="empty-icon">⏳</div><div class="empty-t">Carregando candidatos...</div></div>
</div>

<script>
var SUPA_URL = 'https://cjimsplgxrwkqgzegnkq.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqaW1zcGxneHJ3a3FnemVnbmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTg5MTEsImV4cCI6MjA5MTY3NDkxMX0.V5euouwf-Q4KaskXGB4eLg0FPV7pH96hTrQikcV7K6A';

function supaGet(path) {
  return fetch(SUPA_URL+'/rest/v1/'+path, { headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY } })
    .then(function(r){ if(!r.ok) return r.json().then(function(e){ throw e; }).catch(function(){ throw new Error(r.status); }); return r.json(); });
}
function supaPatch(id, body) {
  return fetch(SUPA_URL+'/rest/v1/crm_candidatos?id=eq.'+id, {
    method:'PATCH',
    headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(body)
  });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ if(!s) return ''; var d = new Date(s+'T12:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'2-digit'}); }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function diasEntre(de, ate){
  if (!de) return null;
  var d1 = new Date(de+'T12:00:00');
  var d2 = ate ? new Date(ate+'T12:00:00') : new Date();
  if (isNaN(d1)) return null;
  d2.setHours(12,0,0,0);
  return Math.floor((d2-d1)/86400000);
}

// ════════ REGIONAL (mesma fonte/lógica do relatório regional.html) ════════
// Fallback usado só se o cadastro do banco falhar — a fonte de verdade é
// NexusConfig.getRegionais() (editável em "Hunters & Parâmetros").
var _REGS_DEFAULT = {
  'Tamires':    ['Blue3 - Bauru','Blue3 - Campinas','Blue3 - Curitiba','Blue3 - Franca','Blue3 - Poços de Caldas','Blue3 - Ribeirão Preto','Blue3 - Rio de Janeiro','Blue3 - São José do Rio Preto','Blue3 - Noventena','Blue3 - Itajaí'],
  'Yokoy':      ['Blue3 - Anywhere','Blue3 - Marília','Blue3 - São José dos Campos','Blue3 - São Paulo'],
  'Bruno':      ['Blue3 - Goiânia','Blue3 - Uberlândia','Blue3 - Brasília','Blue3 - Belo Horizonte','Blue3 - Belém'],
  'MariaLaura': [] // sem praças — filtra por área/vaga no relatório Regional; aqui entra como "sem regional mapeada"
};
var _REGS = JSON.parse(JSON.stringify(_REGS_DEFAULT));

function _regKeyFromNome(nome){
  var n=(nome||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(n.indexOf('tamires')>-1) return 'Tamires';
  if(n.indexOf('yokoy')>-1)   return 'Yokoy';
  if(n.indexOf('bruno')>-1)   return 'Bruno';
  if(n.indexOf('maria')>-1 && n.indexOf('laura')>-1) return 'MariaLaura';
  return null;
}

function carregarRegionaisRC(cb) {
  var fin = false;
  function done(){ if (fin) return; fin = true; cb && cb(); }
  var to = setTimeout(done, 3000);
  if (typeof NexusConfig === 'undefined' || typeof NexusConfig.getRegionais !== 'function') {
    clearTimeout(to); done(); return;
  }
  try {
    NexusConfig.getRegionais(function(err, list){
      clearTimeout(to);
      if (err || !list || !list.length) { done(); return; }
      var novo = {};
      list.forEach(function(rg){
        if ((rg.status||'Ativo') === 'Inativo') return;
        var key = _regKeyFromNome(rg.nome);
        if (!key) return;
        var pr = rg.pracas;
        if (typeof pr === 'string') { try { pr = JSON.parse(pr); } catch(e){ pr = []; } }
        novo[key] = Array.isArray(pr) ? pr : [];
      });
      if (!('MariaLaura' in novo)) novo['MariaLaura'] = [];
      if (Object.keys(novo).length) _REGS = novo;
      done();
    });
  } catch(e) { clearTimeout(to); done(); }
}

function pracaParaRegional(praca) {
  for (var key in _REGS) {
    if (_REGS[key] && _REGS[key].indexOf(praca) > -1) return key;
  }
  return null; // praça não mapeada em nenhuma regional (ou pertence a alguém que filtra por área, como Maria Laura)
}

// ════════ RÉGUAS ════════
var WARN_JANELA = 3; // dias de antecedência para virar "Atenção"

var REGUAS = [
  { key:'r1', num:1, campoBase:'data_contratacao', campoDone:'data_contrato_assinado', prazo:15,
    titulo:'Documentos & Contrato', desc:'15 dias corridos após a contratação',
    lblBase:'Contratado em', lblAcao:'Marcar contrato assinado',
    proximosMarcos:['data_mou','data_inicio'], extraCol:null },
  { key:'r2', num:2, campoBase:'data_mou', campoDone:'data_desligamento_solicitado', prazo:30,
    titulo:'Solicitação de Desligamento', desc:'30 dias corridos após a assinatura do MOU',
    lblBase:'MOU assinado em', lblAcao:'Marcar desligamento solicitado',
    proximosMarcos:['data_inicio'], extraCol:{ key:'instituicao', label:'Instituição de Origem' },
    renovavel:true, campoRenovacoes:'desligamento_renovacoes', renovarDias:30, lblRenovar:'Manter no Processo (+30d)' },
  { key:'r3', num:3, campoBase:'data_inicio', campoDone:'data_contato_30', prazo:30,
    titulo:'Check-in de Performance — 30 dias', desc:'30 dias corridos após o início do trabalho',
    lblBase:'Início em', lblAcao:'Marcar contato realizado',
    proximosMarcos:null, extraCol:{ key:'lider', label:'Líder' } },
  { key:'r4', num:4, campoBase:'data_inicio', campoDone:'data_contato_60', prazo:60,
    titulo:'Check-in de Performance — 60 dias', desc:'60 dias corridos após o início do trabalho',
    lblBase:'Início em', lblAcao:'Marcar contato realizado',
    proximosMarcos:null, extraCol:{ key:'lider', label:'Líder' } },
  { key:'r5', num:5, campoBase:'data_inicio', campoDone:'data_contato_180', prazo:180,
    titulo:'Check-in de Performance — 180 dias', desc:'180 dias corridos após o início do trabalho',
    lblBase:'Início em', lblAcao:'Marcar contato realizado',
    proximosMarcos:null, extraCol:{ key:'lider', label:'Líder' } }
];

var CANDIDATOS = [];
var COLUNAS_OK = true;

function somarDias(iso, dias) {
  var d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0,10);
}

function calcularItem(c, regra) {
  var base = c[regra.campoBase];
  if (!base) return null; // marco não se aplica ainda a este candidato
  var done = c[regra.campoDone];

  if (!done && regra.proximosMarcos) {
    // Prova por data real: se um marco posterior do funil já aconteceu, esta etapa
    // necessariamente já foi resolvida na vida real, mesmo sem registro exato — não precisa mais tratar.
    var jaAvancou = regra.proximosMarcos.some(function(campo){ return !!c[campo]; });
    if (jaAvancou) return null;
  }

  var renovacoes = regra.renovavel ? (c[regra.campoRenovacoes] || 0) : 0;
  var prazoEfetivo = regra.prazo + (renovacoes * (regra.renovarDias || 0));
  var item = { candidato:c, regra:regra, base:base, done:done||null, renovacoes:renovacoes, prazoEfetivo:prazoEfetivo };
  item.dataLimite = somarDias(base, prazoEfetivo);
  if (done) {
    var diasConclusao = diasEntre(base, done);
    item.status = (diasConclusao !== null && diasConclusao > prazoEfetivo) ? 'concluido-atraso' : 'concluido';
    item.diasConclusao = diasConclusao;
  } else {
    var decorridos = diasEntre(base);
    item.diasDecorridos = decorridos;
    var restam = prazoEfetivo - decorridos;
    item.restam = restam;
    if (restam < 0) item.status = 'atrasado';
    else if (restam <= WARN_JANELA) item.status = 'atencao';
    else item.status = 'noprazo';
  }
  return item;
}

function statusClasse(status){ return status.indexOf('concluido')>-1 ? 'concluido'+(status==='concluido-atraso'?' atraso':'') : status; }
function statusLabel(item){
  if (item.status === 'concluido') return 'Concluído';
  if (item.status === 'concluido-atraso') return 'Concluído c/ atraso';
  if (item.status === 'atrasado') return 'Venceu em ' + fmtDate(item.dataLimite) + ' (' + Math.abs(item.restam) + 'd atrás)';
  if (item.status === 'atencao') return item.restam===0 ? 'Vence hoje (' + fmtDate(item.dataLimite) + ')' : 'Vence em ' + fmtDate(item.dataLimite) + ' (' + item.restam + 'd)';
  return 'Vence em ' + fmtDate(item.dataLimite) + ' (faltam ' + item.restam + 'd)';
}

// ════════ CARREGAR DADOS ════════
function carregar() {
  var camposBase = 'id,nome,praca,hunter,lider,instituicao,etapa,data_contratacao,data_mou,data_inicio';
  var camposExtra = 'id,data_contrato_assinado,data_desligamento_solicitado,desligamento_renovacoes,data_contato_30,data_contato_60,data_contato_180';

  Promise.all([
    supaGet('crm_candidatos?select='+camposBase+'&order=nome.asc&limit=1000'),
    supaGet('crm_candidatos?select='+camposExtra+'&limit=1000').catch(function(){ return null; })
  ]).then(function(r){
    var base = r[0] || [];
    var extra = r[1];
    COLUNAS_OK = !!extra;
    var extraMap = {};
    if (extra) extra.forEach(function(e){ extraMap[e.id] = e; });
    CANDIDATOS = base
      .filter(function(c){ return !!c.data_contratacao && c.etapa !== 'Declinou'; })
      .map(function(c){ return Object.assign({}, c, extraMap[c.id]||{}); });
    popularFiltros();
    render();
  }).catch(function(err){
    document.getElementById('content-root').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-t">Erro ao carregar candidatos</div><div class="empty-s">'+esc(JSON.stringify(err))+'</div></div>';
  });
}

function popularFiltros() {
  var hunters = Array.from(new Set(CANDIDATOS.map(function(c){ return c.hunter; }).filter(Boolean))).sort();
  var lideres = Array.from(new Set(CANDIDATOS.map(function(c){ return c.lider; }).filter(Boolean))).sort();
  var pracas  = Array.from(new Set(CANDIDATOS.map(function(c){ return c.praca; }).filter(Boolean))).sort();
  var selH = document.getElementById('f-hunter');
  var selL = document.getElementById('f-lider');
  var selP = document.getElementById('f-praca');
  hunters.forEach(function(h){ selH.innerHTML += '<option value="'+esc(h)+'">'+esc(h)+'</option>'; });
  lideres.forEach(function(l){ selL.innerHTML += '<option value="'+esc(l)+'">'+esc(l)+'</option>'; });
  pracas.forEach(function(p){ selP.innerHTML += '<option value="'+esc(p)+'">'+esc(p)+'</option>'; });
}

// ════════ RENDER ════════
function montarItens() {
  var itens = [];
  CANDIDATOS.forEach(function(c){
    REGUAS.forEach(function(regra){
      var it = calcularItem(c, regra);
      if (it) itens.push(it);
    });
  });
  return itens;
}

function render() {
  if (!COLUNAS_OK) {
    document.getElementById('banner-root').innerHTML = '<div class="banner-warn">⚠️ As colunas de controle da Régua de Contato ainda não existem em <code>crm_candidatos</code>. Rode o script <code>regua_contato_schema.sql</code> no SQL Editor do Supabase para habilitar o registro de conclusão de cada marco. Enquanto isso, os prazos são exibidos apenas como referência, sem opção de "marcar concluído".</div>';
  } else {
    document.getElementById('banner-root').innerHTML = '';
  }

  var itens = montarItens();
  renderKPIs(itens);
  renderSecoes(itens);
  aplicarFiltros();
}

function renderKPIs(itens) {
  var atrasados = itens.filter(function(i){ return i.status==='atrasado'; }).length;
  var atencao   = itens.filter(function(i){ return i.status==='atencao'; }).length;
  var noprazo   = itens.filter(function(i){ return i.status==='noprazo'; }).length;
  var concluidos= itens.filter(function(i){ return i.status.indexOf('concluido')>-1; }).length;

  document.getElementById('kpi-root').innerHTML = [
    kpi('red','Atrasados', atrasados, 'ação necessária', 'atrasado'),
    kpi('amber','Atenção', atencao, 'vencem em até '+WARN_JANELA+' dias', 'atencao'),
    kpi('blue','No Prazo', noprazo, 'dentro do prazo', 'noprazo'),
    kpi('green','Concluídos', concluidos, 'marcos já registrados', 'concluido')
  ].join('');
}
function kpi(cor,label,val,sub,statusFiltro){
  return '<div class="kpi '+cor+'" onclick="filtrarPorStatus(\''+statusFiltro+'\')">'
    +'<div class="kpi-label">'+label+'</div>'
    +'<div class="kpi-value">'+val+'</div>'
    +'<div class="kpi-sub">'+sub+'</div></div>';
}
function filtrarPorStatus(s){ document.getElementById('f-status').value = s; aplicarFiltros(); }

function renderSecoes(itens) {
  var html = REGUAS.map(function(regra){
    var doRegra = itens.filter(function(i){ return i.regra.key === regra.key; });
    doRegra.sort(function(a,b){
      var ord = { atrasado:0, atencao:1, noprazo:2, concluido:3, 'concluido-atraso':3 };
      return (ord[a.status]-ord[b.status]) || (a.candidato.nome||'').localeCompare(b.candidato.nome||'');
    });

    var linhas = doRegra.map(function(it){
      return linhaHtml(it, regra);
    }).join('');

    return '<div class="rc-section" data-regra="'+regra.key+'">'
      + '<div class="rc-sec-header" onclick="toggleSecao(this)">'
        + '<div class="rc-sec-left">'
          + '<div class="rc-sec-num">'+regra.num+'</div>'
          + '<div><div class="rc-sec-title">'+esc(regra.titulo)+'</div><div class="rc-sec-desc">'+esc(regra.desc)+'</div></div>'
        + '</div>'
        + '<div style="display:flex;align-items:center;">'
          + '<span class="rc-sec-count">'+doRegra.length+' candidato'+(doRegra.length!==1?'s':'')+'</span>'
          + '<span class="rc-sec-toggle">▲</span>'
        + '</div>'
      + '</div>'
      + '<table class="rc-table"><thead><tr>'
        + '<th>Candidato</th><th>Praça</th><th>Hunter</th>'
        + (regra.extraCol ? '<th>'+esc(regra.extraCol.label)+'</th>' : '')
        + '<th>'+esc(regra.lblBase)+'</th><th>Status</th><th>Ação</th>'
      + '</tr></thead><tbody>'
        + (linhas || '<tr><td colspan="7" class="rc-empty">Nenhum candidato neste marco</td></tr>')
      + '</tbody></table>'
    + '</div>';
  }).join('');

  document.getElementById('content-root').innerHTML = html;
}

function linhaHtml(it, regra) {
  var c = it.candidato;
  var statusCls = statusClasse(it.status);
  var acaoHtml;
  if (it.status.indexOf('concluido') > -1) {
    acaoHtml = '<span class="rc-sub">'+fmtDate(it.done)+'</span>'
      + (COLUNAS_OK ? '<button class="btn-undo" onclick="desfazerMarco(\''+c.id+'\',\''+regra.campoDone+'\',\''+regra.key+'\')">desfazer</button>' : '');
  } else if (COLUNAS_OK) {
    acaoHtml = '<button class="btn-ok" onclick="concluirMarco(\''+c.id+'\',\''+regra.campoDone+'\',\''+esc(regra.lblAcao)+'\')">'+esc(regra.lblAcao)+'</button>';
    if (regra.renovavel) {
      acaoHtml += '<button class="btn-outline" onclick="renovarPrazo(\''+c.id+'\',\''+regra.campoRenovacoes+'\','+it.renovacoes+',\''+esc(regra.lblRenovar)+'\')">'+esc(regra.lblRenovar)+'</button>';
    }
  } else {
    acaoHtml = '<span class="rc-sub">—</span>';
  }

  var baseCellExtra = (regra.renovavel && it.renovacoes > 0)
    ? '<div class="rc-sub">renovado ' + it.renovacoes + 'x (prazo: ' + it.prazoEfetivo + 'd)</div>' : '';

  return '<tr data-hunter="'+esc(c.hunter||'')+'" data-lider="'+esc(c.lider||'')+'" data-praca="'+esc(c.praca||'')+'" data-regional="'+esc(pracaParaRegional(c.praca)||'_sem')+'" data-status="'+statusCls.split(' ')[0]+'"'
    + ' data-limite="'+esc(fmtDate(it.dataLimite))+'" data-restam="'+(it.restam!==undefined?it.restam:'')+'">'
    + '<td><div class="rc-nome">'+esc(c.nome)+'</div></td>'
    + '<td>'+esc(c.praca||'—')+'</td>'
    + '<td>'+esc(c.hunter||'—')+'</td>'
    + (regra.extraCol ? '<td>'+esc(c[regra.extraCol.key]||'—')+'</td>' : '')
    + '<td>'+fmtDate(it.base)+baseCellExtra+'</td>'
    + '<td><span class="rc-badge '+statusCls+'">'+statusLabel(it)+'</span></td>'
    + '<td>'+acaoHtml+'</td>'
  + '</tr>';
}

function toggleSecao(el) {
  var tabela = el.nextElementSibling;
  var t = el.querySelector('.rc-sec-toggle');
  if (tabela.style.display === 'none') { tabela.style.display=''; t.textContent='▲'; }
  else { tabela.style.display='none'; t.textContent='▼'; }
}

// ════════ AÇÕES ════════
function concluirMarco(id, campo, labelAcao) {
  if (!confirm('Confirmar: "'+labelAcao+'" — hoje ('+fmtDate(hojeISO())+')?')) return;
  var body = {}; body[campo] = hojeISO();
  supaPatch(id, body).then(function(r){
    if (!r.ok) { alert('Erro ao salvar (status '+r.status+').'); return; }
    carregar();
  }).catch(function(e){ alert('Erro ao salvar: '+e); });
}
function desfazerMarco(id, campo) {
  if (!confirm('Desfazer esta conclusão?')) return;
  var body = {}; body[campo] = null;
  supaPatch(id, body).then(function(r){
    if (!r.ok) { alert('Erro ao desfazer (status '+r.status+').'); return; }
    carregar();
  }).catch(function(e){ alert('Erro ao desfazer: '+e); });
}
function renovarPrazo(id, campoRenovacoes, valorAtual, labelAcao) {
  if (!confirm('Confirmar: "'+labelAcao+'"? Isso soma mais 30 dias ao prazo deste candidato (renovação nº '+(valorAtual+1)+').')) return;
  var body = {}; body[campoRenovacoes] = valorAtual + 1;
  supaPatch(id, body).then(function(r){
    if (!r.ok) { alert('Erro ao salvar (status '+r.status+').'); return; }
    carregar();
  }).catch(function(e){ alert('Erro ao salvar: '+e); });
}

// ════════ FILTROS ════════
function aplicarFiltros() {
  var hunter = document.getElementById('f-hunter').value;
  var lider  = document.getElementById('f-lider').value;
  var regional = document.getElementById('f-regional').value;
  var praca  = document.getElementById('f-praca').value;
  var status = document.getElementById('f-status').value;
  var ocultarConcl = document.getElementById('f-ocultar-concluidos').checked;

  var visiveis = 0;
  document.querySelectorAll('.rc-table tbody tr[data-hunter]').forEach(function(tr){
    var okH = !hunter || tr.getAttribute('data-hunter') === hunter;
    var okL = !lider  || tr.getAttribute('data-lider')  === lider;
    var okR = !regional || tr.getAttribute('data-regional') === regional;
    var okP = !praca  || tr.getAttribute('data-praca')  === praca;
    var st  = tr.getAttribute('data-status');
    var okS = !status || st === status;
    var okC = !ocultarConcl || st !== 'concluido';
    var show = okH && okL && okR && okP && okS && okC;
    tr.style.display = show ? '' : 'none';
    if (show) visiveis++;
  });

  document.querySelectorAll('.rc-section').forEach(function(sec){
    var visRows = sec.querySelectorAll('tbody tr[data-hunter]:not([style*="display: none"])').length;
    var countEl = sec.querySelector('.rc-sec-count');
    if (countEl) countEl.textContent = visRows + ' candidato' + (visRows!==1?'s':'');
    sec.style.display = visRows === 0 ? 'none' : '';
  });

  document.getElementById('f-count').textContent = visiveis + ' marco' + (visiveis!==1?'s':'') + ' exibido' + (visiveis!==1?'s':'');
}

function copiarResumo() {
  var lider = document.getElementById('f-lider').value;
  var regional = document.getElementById('f-regional').value;
  var REGIONAL_LABEL = { Tamires:'Tamires', Yokoy:'Yokoy', Bruno:'Bruno', MariaLaura:'Maria Laura', _sem:'Sem regional mapeada' };
  var titulo = 'Retorno de performance';
  if (lider) titulo += ' — ' + lider;
  if (regional) titulo += ' — Regional: ' + (REGIONAL_LABEL[regional] || regional);
  titulo += ' (' + fmtDate(hojeISO()) + ')';

  var partes = [titulo, ''];
  var totalItens = 0;

  document.querySelectorAll('.rc-section').forEach(function(sec){
    if (sec.style.display === 'none') return;
    // Só entram no resumo do líder marcos que JÁ venceram ou vencem em breve —
    // pedir retorno de alguém que ainda tem semanas de prazo não faz sentido.
    var linhas = Array.from(sec.querySelectorAll('tbody tr[data-hunter]')).filter(function(tr){
      return tr.style.display !== 'none' && (tr.getAttribute('data-status') === 'atrasado' || tr.getAttribute('data-status') === 'atencao');
    });
    if (!linhas.length) return;

    var tituloSec = sec.querySelector('.rc-sec-title').textContent.trim();
    partes.push(tituloSec + ':');
    linhas.forEach(function(tr){
      var nome = tr.querySelector('.rc-nome') ? tr.querySelector('.rc-nome').textContent.trim() : '—';
      var status = tr.getAttribute('data-status');
      var limite = tr.getAttribute('data-limite');
      var restam = tr.getAttribute('data-restam');
      var frase;
      if (status === 'atrasado') {
        frase = '• ' + nome + ' — venceu em ' + limite + ' (há ' + Math.abs(restam) + 'd) — poderia nos passar um retorno da performance dele(a)?';
      } else {
        frase = '• ' + nome + ' — vence em ' + limite + ' (em ' + restam + 'd) — já pode ir preparando o retorno';
      }
      partes.push(frase);
      totalItens++;
    });
    partes.push('');
  });

  if (totalItens === 0) {
    alert('Com os filtros atuais, ninguém está com retorno vencido ou próximo do vencimento agora — nada a enviar.');
    return;
  }

  partes.push('Por favor, respondam com um breve parecer de performance para cada nome acima. Obrigado!');
  var texto = partes.join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(function(){
      alert('Resumo copiado! Já pode colar no WhatsApp ou e-mail.');
    }).catch(function(){ prompt('Copie o texto abaixo:', texto); });
  } else {
    prompt('Copie o texto abaixo:', texto);
  }
}
carregarRegionaisRC(function(){ carregar(); });
