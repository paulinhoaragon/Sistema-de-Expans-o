<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Logs do Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cobalt:#1A3BAD;--cobalt-br:#2952E3;
  --canvas:#F4F6FB;--surface:#fff;--rule:#E2E8F5;--s2:#F8FAFF;
  --t1:#0A0F1E;--t2:#374151;--t3:#8892A4;--t4:#B0BAC9;
  --g:#16A34A;--am:#D97706;--red:#DC2626;
  --r8:8px;--r12:12px;--sh:0 1px 4px rgba(10,15,30,.07),0 4px 16px rgba(10,15,30,.05);
}
body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased;}
.page{padding:24px 28px 60px;}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--sh);border-top:2px solid var(--cobalt);}
.kpi.g{border-top-color:var(--g);}
.kpi.am{border-top-color:var(--am);}
.kpi.red{border-top-color:var(--red);}
.kl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.kv{font-size:24px;font-weight:700;color:var(--t1);line-height:1;}
.ks{font-size:10px;color:var(--t4);margin-top:4px;}

/* Filtros */
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;background:var(--surface);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--sh);}
.filtros label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
.filtros select,.filtros input[type="date"]{border:1px solid var(--rule);border-radius:var(--r8);padding:6px 10px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--t1);background:var(--canvas);outline:none;}
.filtros select:focus,.filtros input:focus{border-color:var(--cobalt);}
.btn-f{background:var(--cobalt);color:#fff;border:none;border-radius:var(--r8);padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-f:hover{background:var(--cobalt-br);}
.btn-l{background:var(--s2);color:var(--t2);border:1px solid var(--rule);border-radius:var(--r8);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.f-sep{flex:1;}
.f-count{font-size:11px;color:var(--t3);white-space:nowrap;}

/* Tabela */
.tbl-wrap{background:var(--surface);border-radius:var(--r12);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px;}
.tbl-head{display:grid;grid-template-columns:150px 160px 130px 1fr 60px;background:var(--s2);border-bottom:1px solid var(--rule);padding:0 16px;}
.th{padding:10px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
.log-row{display:grid;grid-template-columns:150px 160px 130px 1fr 60px;border-bottom:1px solid var(--rule);padding:0 16px;align-items:center;cursor:pointer;transition:background .15s;}
.log-row:last-child{border-bottom:none;}
.log-row:hover{background:var(--s2);}
.lc{padding:9px 8px;font-size:12px;}
.l-dt{font-size:10px;color:var(--t3);line-height:1.5;}
.l-usr{font-size:11px;font-weight:600;color:var(--cobalt);}
.l-meta{font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Badges */
.ba{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.ba-crm{background:#EEF2FF;color:#1A3BAD;}
.ba-etapa{background:#FEF3C7;color:#92400E;}
.ba-proposta{background:#F0FDF4;color:#166534;}
.ba-vaga{background:#FDF4FF;color:#7C3AED;}
.ba-login{background:#F0F9FF;color:#0369A1;}
.ba-delete{background:#FEE2E2;color:#DC2626;}
.ba-hist{background:#F8FAFF;color:#374151;}
.ba-outro{background:var(--s2);color:var(--t3);}

/* Paginação */
.pag{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;}
.pag-btn{background:var(--s2);border:1px solid var(--rule);border-radius:var(--r8);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--t2);}
.pag-btn:hover:not(:disabled){background:var(--cobalt);color:#fff;border-color:var(--cobalt);}
.pag-btn:disabled{opacity:.4;cursor:default;}
.pag-info{font-size:11px;color:var(--t3);}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--r12);width:100%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-hd{background:#0A0F1E;padding:14px 18px;border-radius:var(--r12) var(--r12) 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hd h2{color:#fff;font-size:14px;font-weight:600;}
.modal-close{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:14px;width:26px;height:26px;border-radius:6px;cursor:pointer;}
.modal-bd{padding:18px;}
.mr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);}
.mr:last-child{border-bottom:none;}
.mk{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;min-width:110px;}
.mv{font-size:12px;color:var(--t1);flex:1;word-break:break-word;}

/* States */
.st{text-align:center;padding:48px 20px;}
.st-icon{font-size:32px;margin-bottom:10px;}
.st-t{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.st-s{font-size:12px;color:var(--t3);}
</style>
</head>
<body>
<div class="page">

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi"><div class="kl">Total de Registros</div><div class="kv" id="kpi-total">—</div><div class="ks">todos os períodos</div></div>
    <div class="kpi g"><div class="kl">Hoje</div><div class="kv" id="kpi-hoje">—</div><div class="ks">ações registradas</div></div>
    <div class="kpi am"><div class="kl">Esta Semana</div><div class="kv" id="kpi-sem">—</div><div class="ks">últimos 7 dias</div></div>
    <div class="kpi red"><div class="kl">Exclusões</div><div class="kv" id="kpi-del">—</div><div class="ks">registros removidos</div></div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <label>Usuário</label>
    <select id="f-usr"><option value="">Todos</option></select>
    <label>Ação</label>
    <select id="f-acao">
      <option value="">Todas</option>
      <option value="crm">CRM / Candidato</option>
      <option value="etapa">Mudança de Etapa</option>
      <option value="proposta">Proposta</option>
      <option value="vaga">Vaga</option>
      <option value="hist">Histórico de Contatos</option>
      <option value="login">Login</option>
      <option value="delete">Exclusão</option>
    </select>
    <label>De</label><input type="date" id="f-de">
    <label>Até</label><input type="date" id="f-ate">
    <button class="btn-f" onclick="aplicarFiltros()">Filtrar</button>
    <button class="btn-l" onclick="limparFiltros()">Limpar</button>
    <div class="f-sep"></div>
    <span class="f-count" id="f-count"></span>
  </div>

  <!-- Tabela -->
  <div class="tbl-wrap">
    <div class="tbl-head">
      <div class="th">Data / Hora</div>
      <div class="th">Ação</div>
      <div class="th">Usuário</div>
      <div class="th">Resumo</div>
      <div class="th"></div>
    </div>
    <div id="tbl-body">
      <div class="st"><div class="st-icon">⏳</div><div class="st-t">Carregando...</div></div>
    </div>
  </div>

  <!-- Paginação -->
  <div class="pag" id="pag" style="display:none;">
    <button class="pag-btn" id="pag-prev" onclick="mudarPag(-1)">← Anterior</button>
    <span class="pag-info" id="pag-info"></span>
    <button class="pag-btn" id="pag-next" onclick="mudarPag(1)">Próxima →</button>
  </div>

</div>

<!-- Modal -->
<div class="modal-ov" id="modal-det" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="modal-hd">
      <h2>Detalhes do Registro</h2>
      <button class="modal-close" onclick="document.getElementById('modal-det').style.display='none'">✕</button>
    </div>
    <div class="modal-bd" id="modal-bd"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
var SUPA_URL='https://cjimsplgxrwkqgzegnkq.supabase.co';
var SUPA_KEY='sb_publishable_m4pgWOuDEQghiA2w4_axzg_HccJZxDS';

function supa(p){
  return fetch(SUPA_URL+'/rest/v1/'+p,{
    method:'GET',
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    }
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function fmtDt(iso){
  if(!iso)return'—';
  var d=new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
    +'<br>'+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function badgeAcao(acao){
  var a=(acao||'').toLowerCase(),cls='ba-outro';
  if(a.includes('login'))cls='ba-login';
  else if(a.includes('exclu')||a.includes('delet')||a.includes('remov'))cls='ba-delete';
  else if(a.includes('etapa')||a.includes('status'))cls='ba-etapa';
  else if(a.includes('proposta'))cls='ba-proposta';
  else if(a.includes('vaga'))cls='ba-vaga';
  else if(a.includes('hist')||a.includes('obs')||a.includes('contato'))cls='ba-hist';
  else if(a.includes('crm')||a.includes('candidato')||a.includes('edita'))cls='ba-crm';
  return '<span class="ba '+cls+'">'+esc(acao||'—')+'</span>';
}

function parseMeta(m){
  if(!m)return{};
  if(typeof m==='object')return m;
  try{return JSON.parse(m);}catch(e){return{info:m};}
}

function resumoMeta(m){
  var o=parseMeta(m),keys=Object.keys(o);
  if(!keys.length)return'—';
  var prio=['candidato','nome','cargo','de','para','acao'];
  for(var i=0;i<prio.length;i++){if(o[prio[i]])return esc(String(o[prio[i]]));}
  return esc(String(o[keys[0]]));
}

var _todos=[],_filtrados=[],_pag=1,_pp=50;

function carregarLogs(){
  supa('logs_auditoria?order=criado_em.desc&limit=1000')
    .then(function(rows){
      _todos=rows||[];
      popularUsuarios();
      calcKPIs();
      // Datas padrão
      var h=new Date(),d30=new Date(h);d30.setDate(d30.getDate()-30);
      document.getElementById('f-ate').value=h.toISOString().split('T')[0];
      document.getElementById('f-de').value=d30.toISOString().split('T')[0];
      aplicarFiltros();
    })
    .catch(function(e){
      document.getElementById('tbl-body').innerHTML='<div class="st"><div class="st-icon">❌</div><div class="st-t">Erro ao conectar ao Supabase</div><div class="st-s">'+(e&&e.message?e.message:'Verifique as permissões da tabela logs_auditoria')+'</div></div>';
    });
}

function popularUsuarios(){
  var us={};
  _todos.forEach(function(r){if(r.usuario)us[r.usuario]=true;});
  var sel=document.getElementById('f-usr');
  sel.innerHTML='<option value="">Todos</option>';
  Object.keys(us).sort().forEach(function(u){
    sel.innerHTML+='<option value="'+esc(u)+'">'+esc(u)+'</option>';
  });
}

function calcKPIs(){
  var h=new Date();h.setHours(0,0,0,0);
  var s=new Date(h);s.setDate(s.getDate()-7);
  document.getElementById('kpi-total').textContent=_todos.length;
  document.getElementById('kpi-hoje').textContent=_todos.filter(function(r){return r.criado_em&&new Date(r.criado_em)>=h;}).length;
  document.getElementById('kpi-sem').textContent=_todos.filter(function(r){return r.criado_em&&new Date(r.criado_em)>=s;}).length;
  document.getElementById('kpi-del').textContent=_todos.filter(function(r){var a=(r.acao||'').toLowerCase();return a.includes('exclu')||a.includes('delet')||a.includes('remov');}).length;
}

function aplicarFiltros(){
  var usr=(document.getElementById('f-usr')||{}).value||'';
  var acao=(document.getElementById('f-acao')||{}).value||'';
  var de=(document.getElementById('f-de')||{}).value||'';
  var ate=(document.getElementById('f-ate')||{}).value||'';
  var mapa={crm:'candidato|crm|edita',etapa:'etapa|status',proposta:'proposta',vaga:'vaga',hist:'hist|obs|contato',login:'login',delete:'exclu|delet|remov'};
  _filtrados=_todos.filter(function(r){
    if(usr&&(r.usuario||'')!==usr)return false;
    if(acao){var a=(r.acao||'').toLowerCase();if(!new RegExp(mapa[acao]||acao).test(a))return false;}
    if(de&&r.criado_em){if(new Date(r.criado_em)<new Date(de))return false;}
    if(ate&&r.criado_em){var ad=new Date(ate);ad.setHours(23,59,59,999);if(new Date(r.criado_em)>ad)return false;}
    return true;
  });
  _pag=1;
  document.getElementById('f-count').textContent=_filtrados.length+' registro'+(_filtrados.length!==1?'s':'');
  renderTabela();
}

function limparFiltros(){
  document.getElementById('f-usr').value='';
  document.getElementById('f-acao').value='';
  var h=new Date(),d30=new Date(h);d30.setDate(d30.getDate()-30);
  document.getElementById('f-de').value=d30.toISOString().split('T')[0];
  document.getElementById('f-ate').value=h.toISOString().split('T')[0];
  aplicarFiltros();
}

function renderTabela(){
  var body=document.getElementById('tbl-body');
  var pag=document.getElementById('pag');
  if(!_filtrados.length){
    body.innerHTML='<div class="st"><div class="st-icon">📋</div><div class="st-t">Nenhum registro encontrado</div><div class="st-s">A tabela logs_auditoria está vazia ou sem registros no período.</div></div>';
    pag.style.display='none';
    return;
  }
  var totPag=Math.ceil(_filtrados.length/_pp);
  var sl=_filtrados.slice((_pag-1)*_pp,_pag*_pp);
  body.innerHTML=sl.map(function(r){
    return '<div class="log-row" onclick="abrirDet('+r.id+')">'
      +'<div class="lc l-dt">'+fmtDt(r.criado_em)+'</div>'
      +'<div class="lc">'+badgeAcao(r.acao)+'</div>'
      +'<div class="lc l-usr">'+esc(r.usuario||'—')+'</div>'
      +'<div class="lc l-meta">'+resumoMeta(r.meta)+'</div>'
      +'<div class="lc" style="text-align:center;color:var(--cobalt);font-size:14px;">→</div>'
      +'</div>';
  }).join('');
  if(totPag>1){
    pag.style.display='flex';
    document.getElementById('pag-info').textContent='Pág. '+_pag+'/'+totPag+' · '+_filtrados.length+' registros';
    document.getElementById('pag-prev').disabled=_pag<=1;
    document.getElementById('pag-next').disabled=_pag>=totPag;
  } else {
    pag.style.display='none';
  }
}

function mudarPag(dir){
  _pag=Math.max(1,Math.min(Math.ceil(_filtrados.length/_pp),_pag+dir));
  renderTabela();
  window.scrollTo({top:0,behavior:'smooth'});
}

function abrirDet(id){
  var r=_todos.find(function(x){return x.id===id;});
  if(!r)return;
  var m=parseMeta(r.meta);
  var rows=[['Data/Hora',fmtDt(r.criado_em)],['Ação',r.acao||'—'],['Usuário',r.usuario||'—']];
  Object.keys(m).forEach(function(k){rows.push([k,String(m[k])]);});
  document.getElementById('modal-bd').innerHTML=rows.map(function(row){
    return '<div class="mr"><span class="mk">'+esc(row[0])+'</span><span class="mv">'+row[1]+'</span></div>';
  }).join('');
  document.getElementById('modal-det').style.display='flex';
}

// Iniciar ao carregar
window.addEventListener('DOMContentLoaded', function(){
  carregarLogs();
});
</script>
</body>
</html>
