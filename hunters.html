<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus · Performance Hunters · Blue3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0A0F1E;--cobalt:#1A3BAD;--cobalt-gl:#4A70F5;--canvas:#F4F6FB;--surface:#fff;--rule:#E2E6F2;--t1:#0A0F1E;--t2:#3A4268;--t3:#7A82A8;--t4:#A8B0CC}
body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;margin:0;padding:0}
.cover{background:var(--ink);min-height:130px;position:relative;overflow:hidden}
.cg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:52px 52px}
.cgl{position:absolute;top:-60px;right:-40px;width:400px;height:400px;background:radial-gradient(ellipse,rgba(41,82,227,.18) 0%,transparent 65%)}
.cover-in{position:relative;max-width:1100px;margin:0 auto;padding:20px 28px 16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.b3w{font-size:18px;font-weight:600;color:#fff}.b3w em{font-style:normal;color:var(--cobalt-gl)}
.ct{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#fff}
.cs{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px}
.cover-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(74,112,245,.4),transparent)}
.page{max-width:1100px;margin:0 auto;padding:20px 28px 60px;min-height:calc(100vh - 130px)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.st{font-size:13px;font-weight:600;color:var(--t1)}.ss{font-size:11px;color:var(--t3);margin-left:auto}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
@media(max-width:700px){.hgrid{grid-template-columns:1fr}}
.hcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .3s,box-shadow .3s;position:relative;overflow:hidden}
.hcard.meta-atingida{border-color:rgba(250,204,21,.5);animation:hcard-pulse 2.5s ease-in-out infinite;}
@keyframes hcard-pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.0),var(--sh);}50%{box-shadow:0 0 24px 4px rgba(250,204,21,.18),var(--sh);}}
.hcard-crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%) scale(0);font-size:20px;transition:top .5s cubic-bezier(.175,.885,.32,1.275),transform .5s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;z-index:2;}
.hcard.meta-atingida .hcard-crown{top:-10px;transform:translateX(-50%) scale(1);}
.hcard-meta-badge{display:none;align-items:center;justify-content:center;gap:5px;margin-top:10px;padding:6px 12px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:20px;font-size:10px;font-weight:700;color:#FCD34D;letter-spacing:.04em;}
.hcard.meta-atingida .hcard-meta-badge{display:flex;}
.hcard-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s;}
.hcard.meta-atingida .hcard-particles{opacity:1;}
.hparticle{position:absolute;width:4px;height:4px;border-radius:50%;animation:hpart-up 3s ease-in-out infinite;}
@keyframes hpart-up{0%{transform:translateY(100%) scale(0);opacity:0;}20%{opacity:1;}80%{opacity:.7;}100%{transform:translateY(-160px) scale(1);opacity:0;}}
.hcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,15,30,.1)}
.hcard-top{height:3px;border-radius:14px 14px 0 0;position:absolute;top:0;left:0;right:0}
.hcard-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--t1);margin-bottom:2px;margin-top:4px}
.hcard-sub{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-bottom:14px}
.hs{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--rule);font-size:12px}
.hs:last-child{border-bottom:none}
.hl{color:var(--t3)}.hv{font-weight:700;color:var(--t1)}
.pace-bar{height:6px;background:var(--rule);border-radius:3px;margin-top:12px;overflow:hidden}
.pace-fill{height:100%;border-radius:3px;transition:width .6s ease}
.pace-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:4px}
.rank-box{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.rank-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rrow:last-child{margin-bottom:0}
.rn{font-size:11px;font-weight:700;color:var(--t4);width:20px;text-align:center}
.rname{font-size:13px;font-weight:600;color:var(--t1);width:76px}
.rtrack{flex:1;height:22px;background:var(--canvas);border-radius:5px;overflow:hidden}
.rfill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px}
.rval-lbl{font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.rval{font-size:12px;font-weight:700;color:var(--t1);width:90px;text-align:right}
/* detail */
.back-btn{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px}
.back-btn:hover{background:var(--canvas)}
.krow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:700px){.krow{grid-template-columns:repeat(2,1fr)}}
.kc{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 15px}
.kl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.kv{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--t1);line-height:1}
.ks{font-size:10px;color:var(--t3);margin-top:3px}
.mou-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.mou-box{flex:1;padding:12px 14px;border-radius:10px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
thead th{background:var(--ink);color:rgba(255,255,255,.5);padding:8px 11px;text-align:right;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
thead th:first-child{text-align:left}
tbody tr{border-bottom:1px solid var(--rule)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:#F0F4FF}
tbody tr:nth-child(even) td{background:#FAFBFE}
tbody td{padding:8px 11px;text-align:right;color:var(--t2)}
tbody td:first-child{text-align:left;font-weight:600;color:var(--t1)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.bg-g{background:#DCFCE7;color:#15803D}.bg-b{background:#EEF2FD;color:#1A3BAD}.bg-a{background:#FEF3C7;color:#92400E}
.bd{width:5px;height:5px;border-radius:50%;background:currentColor}
</style>
<script src="config.js"></script>
<script src="pipeline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="cover"><div class="cg"></div><div class="cgl"></div>
<div class="cover-in">
  <div><div style="display:flex;align-items:center;gap:10px;"><svg width="26" height="26" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><radialGradient id="ncg" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#7AA3FF"/><stop offset="100%" stop-color="#1A3BAD"/></radialGradient><line x1="30" y1="8" x2="46" y2="17" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="46" y1="17" x2="46" y2="35" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="46" y1="35" x2="30" y2="44" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="30" y1="44" x2="14" y2="35" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="14" y1="35" x2="14" y2="17" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="14" y1="17" x2="30" y2="8" stroke="#4A70F5" stroke-width="2" stroke-opacity=".7"/><line x1="30" y1="8" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><line x1="46" y1="17" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><line x1="46" y1="35" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><line x1="30" y1="44" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><line x1="14" y1="35" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><line x1="14" y1="17" x2="30" y2="26" stroke="#4A70F5" stroke-width="1.2" stroke-opacity=".5"/><circle cx="30" cy="8" r="3" fill="#4A70F5"/><circle cx="46" cy="17" r="3" fill="#4A70F5"/><circle cx="46" cy="35" r="3" fill="#4A70F5"/><circle cx="30" cy="44" r="3" fill="#4A70F5"/><circle cx="14" cy="35" r="3" fill="#4A70F5"/><circle cx="14" cy="17" r="3" fill="#4A70F5"/><circle cx="30" cy="26" r="5.5" fill="url(#ncg)" stroke="#4A70F5" stroke-width="1.5"/><circle cx="28.5" cy="24.5" r="1.8" fill="white" fill-opacity=".45"/></svg><div><div style="font-size:15px;font-weight:700;color:#fff;letter-spacing:.05em;">NEXUS</div><div style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#4A70F5;margin-top:1px;">Blue3 Expansão Suite</div></div></div></div>
  <div><div class="ct">Performance de Hunters</div>
  <div class="cs">Meta semestral: 40 contratações</div></div>
</div>  
<div class="cover-rule"></div></div>

<div id="diag" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#0f172a;color:#f1f5f9;font-size:12px;padding:10px 20px;z-index:9999;font-family:monospace;border-top:2px solid #3b82f6;"></div>

<div class="page">
  <div id="view-ov">
    <div id="bonus-summary"></div>
    <div class="sh"><div class="st">Visão Geral</div><div class="ss">Clique em um hunter para detalhes</div></div>
    <div class="hgrid" id="hgrid"></div>
    <div class="sh"><div class="st">Rankings</div></div>
    <div class="rank-box"><div class="rank-title">AuC Alvo Total</div><div id="r-auc"></div></div>
    <div class="rank-box"><div class="rank-title">Contratações vs Meta</div><div id="r-cont"></div></div>
    <div class="rank-box"><div class="rank-title">Comp. Total Gerada</div><div id="r-comp"></div></div>
  </div>
  <div id="view-det" style="display:none">
    <button class="back-btn" onclick="showOv()">&#8592; Visão geral</button>
    <div id="det-content"></div>
  </div>
</div>
<script>
// pipeline.js carregado externamente via <script src="pipeline.js">


// ── Dados de hunters carregados dinamicamente do Supabase ──
var HUNTER_DB   = [];   // hunters cadastrados em Configurações (Supabase)
var HUNTER_PHOTOS = {}; // preenchido pelo Supabase (foto_url)
var HUNTER_METAS  = {}; // preenchido pelo Supabase (meta)
var HUNTER_COLORS = {}; // cores auto-geradas por índice
var HUNTER_ORDER  = []; // ordem por nome
var H = [];
var _PALETA = ['#6366F1','#EC4899','#B8962E','#16A34A','#0891B2','#DC2626','#7C3AED','#EA580C'];

function diag(m){var e=document.getElementById('diag');if(!e)return;e.style.display='block';e.textContent=m;clearTimeout(diag._t);diag._t=setTimeout(function(){e.style.display='none';},7000);}
function ns(s){return String(s||'').trim().toLowerCase();}
function fmt(v){if(!v||v===0)return'---';var a=Math.abs(v);if(a>=1e6)return'R$ '+(v/1e6).toFixed(2).replace('.',',')+'MM';if(a>=1e3)return'R$ '+(v/1e3).toFixed(0)+'K';return'R$ '+v.toLocaleString('pt-BR');}

function getBonusTier(t,p){
  if(t>=26&&p>=0.7)return{lbl:'3 sal',color:'#16A34A',falta:0};
  if(t>=26)return{lbl:'2.5 sal',color:'#1A3BAD',falta:0,next:'3 sal (70% senior)'};
  if(t>=21)return{lbl:'2.5 sal',color:'#1A3BAD',falta:26-t,next:'3 sal'};
  if(t>=16)return{lbl:'2 sal',color:'#B45309',falta:21-t,next:'2.5 sal'};
  if(t>=11)return{lbl:'1.5 sal',color:'#B8962E',falta:16-t,next:'2 sal'};
  if(t>=1)return{lbl:'1 sal',color:'#64748B',falta:11-t,next:'1.5 sal'};
  return{lbl:'Sem bonus',color:'#94A3B8',falta:1,next:'1 sal'};
}


// ════════════════════════════════════════════════════════════════
// carregarHunterDB — Carrega hunters do Supabase e popula variáveis
// de foto, meta e cor. Callback após carregamento.
// ════════════════════════════════════════════════════════════════
function carregarHunterDB(cb){
  if(typeof NexusConfig==='undefined'){ if(cb) cb([]); return; }
  // Invalidar cache para garantir dados frescos do Supabase
if(NexusConfig._cache) NexusConfig._cache.hunters=null;
NexusConfig.getHunters(function(err,hunters){
    if(err||!hunters){ if(cb) cb([]); return; }
    HUNTER_DB=hunters;
    // Resetar e preencher variáveis
    HUNTER_PHOTOS={}; HUNTER_METAS={}; HUNTER_COLORS={}; HUNTER_ORDER=[];
    var cores=['#6366F1','#EC4899','#B8962E','#16A34A','#0891B2','#DC2626','#7C3AED','#EA580C'];
    hunters.forEach(function(h,i){
      var key=(h.nome||'').trim().toLowerCase();
      if(h.foto_url) HUNTER_PHOTOS[key]=h.foto_url;
      if(h.meta!=null&&h.meta!==false) HUNTER_METAS[key]=Number(h.meta);
      HUNTER_COLORS[key]=cores[i%cores.length];
      HUNTER_ORDER.push(h.nome);
    });
    if(cb) cb(hunters);
  });
}

function buildH(hunters,cands){
  var ord=[];
  // Ordem baseada no cadastro do Supabase
    hunters.sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
    hunters.forEach(function(h){ ord.push(h); });
  return ord.map(function(h){
      var nomKey=(h.nome||'').trim().toLowerCase();
    var meta=HUNTER_METAS[nomKey]||0,color=HUNTER_COLORS[nomKey]||'#64748B';
    var pace=meta>0?Math.round(h.total/meta*100):null,hn=ns(h.nome);
    var cs=cands.filter(function(c){return ns(c.h)===hn;}).map(function(c){
      return{nome:c.n,filial:c.p,status:c.st,mou:c.mou,inicio:c.inicio||null,auc:c.cap,piso:c.piso,periodo:c.periodo,comp:c.comp,sen:c.sen};
    });
    return{nome:h.nome,total:h.total,meta:meta,pace_pct:pace,trabalhando:h.trab,auc:h.auc*1e6,comp:h.comp,mou_ok:h.mouOk,mou_pend:h.total-h.mouOk,senior:h.senior,pleno:h.pleno,junior:h.junior,candidatos:cs,color:color};
  });
}

function showOv(){document.getElementById('view-ov').style.display='block';document.getElementById('view-det').style.display='none';}
function kc(l,v,s){return'<div class="kc" style="border-top:3px solid var(--cobalt)"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="ks">'+s+'</div></div>';}

function showDet(nome){
  var h=H.find(function(x){return x.nome===nome;});if(!h)return;
  document.getElementById('view-ov').style.display='none';
  document.getElementById('view-det').style.display='block';
  var pc=h.pace_pct,pcC=pc!=null?(pc>=100?'#16A34A':pc>=70?'#B8962E':'#DC2626'):'#94A3B8';
  var pcLabel=pc!=null?pc+'%':'Sem meta';
  var metaLabel=h.meta>0?h.meta:'—';
  document.getElementById('det-content').innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">'
    +'<div style="width:10px;height:40px;border-radius:4px;background:'+h.color+'"></div>'
    +'<div><div style="font-family:Playfair Display,serif;font-size:22px;font-weight:600;color:var(--t1)">'+h.nome+'</div>'
    +'<div style="font-size:11px;color:var(--t3)">'+h.total+' contratos · Meta: '+metaLabel+' · Pace: '+pcLabel+'</div></div></div>'
    +'<div class="krow">'+kc('Contratações',h.total+(h.meta>0?'/'+h.meta:''),'meta '+(h.meta>0?h.meta:'a definir'))+kc('AuC Alvo',fmt(h.auc),'total')+kc('Comp.',fmt(h.comp),'contratos')+kc('Trabalhando',h.trabalhando,'iniciados')+'</div>'
    +'<div class="mou-row">'
    +'<div class="mou-box" style="background:#DCFCE7"><div style="font-size:11px;font-weight:700;color:#15803D">MOU OK</div><div style="font-size:26px;font-weight:700;color:#15803D">'+h.mou_ok+'</div></div>'
    +'<div class="mou-box" style="background:#FEF3C7"><div style="font-size:11px;font-weight:700;color:#92400E">MOU Pend.</div><div style="font-size:26px;font-weight:700;color:#92400E">'+h.mou_pend+'</div></div>'
    +'<div class="mou-box" style="background:#EEF2FD"><div style="font-size:11px;font-weight:700;color:#1A3BAD">Trabalhando</div><div style="font-size:26px;font-weight:700;color:#1A3BAD">'+h.trabalhando+'</div></div>'
    +'<div class="mou-box" style="background:var(--canvas);flex:2">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px">Pace vs Meta</div>'
    +(h.meta>0
      ?'<div style="height:8px;background:var(--rule);border-radius:4px;overflow:hidden">'
        +'<div style="height:100%;width:'+Math.min(pc,100)+'%;background:'+pcC+';border-radius:4px"></div></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:4px"><span>0</span><span style="font-weight:700;color:'+pcC+'">'+pcLabel+'</span><span>'+h.meta+'</span></div>'
      :'<div style="font-size:12px;color:var(--t4);margin-top:8px;">Meta a definir em julho</div>'
    )
    +'</div></div>'
    +'<div class="sh"><div class="st">Candidatos</div><div class="ss">'+h.total+'</div></div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>Candidato</th><th>Filial</th><th>Status</th><th>MOU</th><th>Inicio</th><th>Piso</th><th>Periodo</th><th>AuC</th><th>Comp.</th></tr></thead>'
    +'<tbody>'+h.candidatos.map(function(c){
      var sb=(c.status||'').trim()==='Trabalhando'?'<span class="badge bg-g"><span class="bd"></span>Trab.</span>':'<span class="badge bg-b">Contrat.</span>';
      var mb=(c.mou||'').trim()==='Assinado'?'<span class="badge bg-g">OK</span>':'<span class="badge bg-a">Pend.</span>';
      return'<tr><td>'+c.nome+'</td><td style="color:var(--t3)">'+c.filial+'</td><td>'+sb+'</td><td>'+mb+'</td><td>'+(c.inicio||'---')+'</td><td>'+fmt(c.piso)+'</td><td>'+c.periodo+'m</td><td>'+fmt(c.auc*1e6)+'</td><td>'+fmt(c.comp)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function rank(id,sf,lf){
  var el=document.getElementById(id);if(!el)return;
  if(!H.length){el.innerHTML='';return;}
  var s=H.slice().sort(function(a,b){return sf(b)-sf(a);});
  var mx=sf(s[0])||1;
  el.innerHTML=s.map(function(h,i){
    var p=Math.max(8,Math.round(sf(h)/mx*100));
    return'<div class="rrow"><div class="rn">'+(i+1)+'.</div><div class="rname">'+h.nome+'</div>'
      +'<div class="rtrack"><div class="rfill" style="width:'+p+'%;background:'+h.color+'">'
      +'<span class="rval-lbl">'+lf(sf(h))+'</span></div></div></div>';
  }).join('');
}

function renderBonusCards(){
  var el=document.getElementById('bonus-summary');if(!el)return;
  // Hunters não-gestores com meta definida (elegíveis para bonus)
  var bh=H.filter(function(h){
    var dbH=HUNTER_DB.find(function(d){ return d.nome===h.nome; });
    return (!dbH || dbH.is_gestor !== true) && h.meta > 0;
  });
  if(!bh.length){el.innerHTML='';return;}
  var totalContr=bh.reduce(function(s,h){return s+h.total;},0);
  var metaTotal=bh.reduce(function(s,h){return s+h.meta;},0);
  var pctTotal=metaTotal>0?Math.min(100,Math.round(totalContr/metaTotal*100)):0;

  el.innerHTML=
    // Título caderno de metas

function renderPage(){
  var D=window.Blue3Data;
  if(!window.Blue3Ready||!D||!D.hunters||!D.hunters.length){
    diag('SEM DADOS - va para home e faca upload do CSV');
    showEmptyState();
    return;
  }
  // Carregar dados do Supabase (foto, meta) e depois renderizar
  carregarHunterDB(function(dbHunters){
    // Enriquecer HUNTER_METAS e HUNTER_PHOTOS com dados do Supabase
    // HUNTER_METAS e HUNTER_PHOTOS já foram populados dentro de carregarHunterDB
    // Aqui só garantimos que hunters do CSV sem cadastro no Supabase
    // não usem fallback errado
     D.hunters.forEach(function(h){
      var key=(h.nome||'').trim().toLowerCase();
      if(HUNTER_METAS[key]===undefined){
        HUNTER_METAS[key]=h.meta||0;
      }
    });
    H=buildH(D.hunters,D.candidatos);
    diag('OK: '+H.length+' hunters · Supabase integrado (meta+foto)');
    renderOv();
  });
}

function uploadCSV(input){
  var file=input.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var text=e.target.result;
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      var lines=text.split('\n').filter(function(l){return l.trim();});
      var sep=lines[0].indexOf(';')>-1?';':',';
      var hh=lines[0].split(sep).map(function(x){return x.trim().replace(/^"|"$/g,'');});
      var rows=[];
      for(var i=1;i<lines.length;i++){
        if(!lines[i].trim())continue;
        var v=lines[i].split(sep),o={};
        hh.forEach(function(k,j){o[k]=(v[j]||'').trim().replace(/^"|"$/g,'');});
        var st=(o['Status']||'').trim();
        if(o['Candidato']&&(st==='Trabalhando'||st==='Contratado(a)'))rows.push(o);
      }
      if(!rows.length){alert('Nenhum candidato valido no CSV.');return;}
      localStorage.setItem('B3D',JSON.stringify(rows));
      diag('CSV carregado: '+rows.length+' candidatos');
      if(Blue3_runPipeline())renderPage();
    }catch(err){alert('Erro: '+err.message);}
    input.value='';
  };
  rd.readAsText(file,'UTF-8');
}

document.addEventListener('DOMContentLoaded',function(){
  diag('Iniciando hunters — buscando do Supabase...');
  try { localStorage.removeItem('B3D'); localStorage.removeItem('B3D_RAW'); } catch(e){}

  if (typeof blue3LoadData === 'function') {
    blue3LoadData(function(rows) {
      if (!rows || !rows.length) { showEmptyState('Sem dados no Supabase.'); return; }
      window.Blue3Data = {
        candidatos: [], financeiros: [], paybacks: [],
        hunters: [], pipeline: [], ma: [], resumoGeral: {},
        _rawRows: rows, _ma: [], _pipeline: [], _pipelineNeg: []
      };
      if (Blue3_dataLoader()) {
        Blue3_financeMetrics();
        Blue3_payback();
        Blue3_huntersPerformance();
        window.Blue3Ready = true;
        renderPage();
      } else {
        showEmptyState('Falha ao processar dados.');
      }
    });
  } else {
    showEmptyState('pipeline.js não carregado.');
    diag('ERRO: blue3LoadData não encontrado');
  }
});
